  function montarAssinatura() {
    const cv = document.getElementById('assin-canvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let desenhando = false, mexeu = false;

    function preparar() {
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0F1F3A';
      if (E.rel.assinatura) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height);
        img.src = E.rel.assinatura;
      }
    }
    function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', e => {
      desenhando = true; mexeu = false;
      try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ok */ }
      const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault();
    });
    cv.addEventListener('pointermove', e => {
      if (!desenhando) return;
      const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); mexeu = true;
    });
    const fim = () => {
      if (!desenhando) return;
      desenhando = false;
      if (mexeu) { E.rel.assinatura = cv.toDataURL('image/png'); E.salvar(); atualizarResumo(); }
    };
    cv.addEventListener('pointerup', fim);
    cv.addEventListener('pointercancel', fim);
    E.prepararAssinatura = preparar;
    requestAnimationFrame(preparar);
  }

  /* =======================================================
     Eventos
     ======================================================= */
  function definirCampo(caminho, valor) {
    const partes = caminho.split('.');
    let o = E.rel;
    for (let i = 0; i < partes.length - 1; i++) o = o[partes[i]] = o[partes[i]] || {};
    o[partes[partes.length - 1]] = valor;
  }

  function ligarEventos() {
    const m = E.main;

    m.addEventListener('input', ev => {
      const t = ev.target;
      if (t.dataset.med) {
        const limpo = u.limparMedida(t.value);
        if (limpo !== t.value) t.value = limpo;
        const c = cota(t.dataset.med);
        c.medidas[+t.dataset.i] = limpo;
        atualizarLinha(c); atualizarResumo(); E.salvar();
      } else if (t.dataset.nom) {
        const limpo = u.limparMedida(t.value);
        if (limpo !== t.value) t.value = limpo;
        const c = cota(t.dataset.nom);
        const n = u.num(limpo);
        c.nominal = isNaN(n) ? null : n;
        atualizarLinha(c); atualizarResumo(); E.salvar();
      } else if (t.dataset.tol) {
        const limpo = u.limparMedida(t.value).replace('-', '');
        if (limpo !== t.value) t.value = limpo;
        const c = cota(t.dataset.id);
        const n = u.num(limpo);
        c[t.dataset.tol === 'sup' ? 'tolSup' : 'tolInf'] = isNaN(n) ? null : n;
        atualizarLinha(c); atualizarResumo(); E.salvar();
      } else if (t.dataset.legenda) {
        const f = E.rel.fotos.find(x => x.id === t.dataset.legenda);
        if (f) { f.legenda = u.maiusc(t.value); E.salvar(); }
      } else if (t.dataset.campo) {
        let v = t.value;
        if (t.classList.contains('maiusc')) v = u.maiusc(v);
        if (t.dataset.campo === 'ident.quantidade') { v = v.replace(/\D/g, ''); if (v !== t.value) t.value = v; }
        definirCampo(t.dataset.campo, v);
        if (t.dataset.campo === 'produto.descricao') document.getElementById('ed-titulo').textContent = v || 'Novo relatório de inspeção';
        if (t.dataset.campo === 'dataInspecao') { pintarCab(); pintarInstr(); }
        atualizarResumo(); E.salvar();
      }
    });

    m.addEventListener('keydown', ev => {
      const t = ev.target;
      if (ev.key !== 'Enter' || !t.dataset.med) return;
      ev.preventDefault();
      const todos = Array.from(m.querySelectorAll('input[data-med]:not([disabled])'))
        .sort((a, b) => (+a.dataset.i - +b.dataset.i) || (+a.dataset.ordem - +b.dataset.ordem));
      const prox = todos[todos.indexOf(t) + 1];
      if (prox) { prox.focus(); prox.select(); } else t.blur();
    });

    m.addEventListener('change', async ev => {
      const t = ev.target, r = E.rel, p = r.produto;
      if (t.dataset.sel) {
        const n = N.obter(p.normaId);
        const anterior = p.sel[t.dataset.sel] || '';
        if (r.cotas.some(c => c.origem === 'norma') && !(await podeTrocarProduto())) { t.value = anterior; return; }
        p.sel[t.dataset.sel] = t.value;
        // limpa os seletores seguintes
        const idx = n.seletores.findIndex(s => s.id === t.dataset.sel);
        n.seletores.slice(idx + 1).forEach(s => { delete p.sel[s.id]; });
        aplicarNorma();
        pintarProduto(); pintarDim(); pintarVisual(); pintarCab(); atualizarResumo(); E.salvar();
        const prox = n.seletores[idx + 1];
        if (prox) { const el = document.getElementById('sel-' + prox.id); if (el) el.focus(); }
      } else if (t.dataset.acaoChange === 'norma') {
        if (!(await podeTrocarProduto())) { t.value = p.normaId || ''; return; }
        p.normaId = t.value || null; p.sel = {};
        aplicarNorma();
        pintarProduto(); pintarDim(); pintarVisual(); pintarCab(); atualizarResumo(); E.salvar();
      } else if (t.dataset.acaoChange === 'produto-desenho') {
        if (!(await podeTrocarProduto())) { t.value = p.produtoId || ''; return; }
        aplicarDesenho(t.value);
        pintarProduto(); pintarDim(); pintarVisual(); pintarCab(); atualizarResumo(); E.salvar();
      } else if (t.dataset.acaoChange === 'foto-add') {
        if (t.files && t.files.length) await adicionarFotos(t.files);
      }
    });

    m.addEventListener('click', async ev => {
      const ir = ev.target.closest('[data-ir]');
      if (ir) {
        ev.preventDefault();
        const alvo = document.getElementById('sec-' + ir.dataset.ir);
        if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const b = ev.target.closest('[data-acao]');
      if (!b) return;
      const r = E.rel, p = r.produto, acao = b.dataset.acao;

      if (acao === 'modo') {
        if (p.modo === b.dataset.v) return;
        if (!(await podeTrocarProduto())) return;
        p.modo = b.dataset.v;
        p.sel = {}; p.descricao = ''; p.chave = null; p.produtoId = null; p.nota = ''; p.normaNome = '';
        r.cotas = r.cotas.filter(c => c.origem === 'manual');
        definirVisuaisDaNorma([]);
        pintarProduto(); pintarDim(); pintarVisual(); pintarCab(); atualizarResumo(); E.salvar();
      } else if (acao === 'pecas') {
        mudarPecas(+b.dataset.d);
      } else if (acao === 'sit') {
        const c = cota(b.dataset.id);
        c.sitManual = c.sitManual === b.dataset.v ? null : b.dataset.v;
        atualizarLinha(c); atualizarResumo(); E.salvar();
      } else if (acao === 'just') {
        justificar(b.dataset.id);
      } else if (acao === 'mais') {
        opcoesCota(b.dataset.id);
      } else if (acao === 'add-cota') {
        adicionarCota();
      } else if (acao === 'vis') {
        const v = r.visual.find(x => x.id === b.dataset.id);
        v.resp = v.resp === b.dataset.r ? null : b.dataset.r;
        b.parentElement.querySelectorAll('button').forEach(x => { x.className = x.dataset.r === v.resp ? 'sel r-' + v.resp : ''; });
        atualizarResumo(); E.salvar();
      } else if (acao === 'instr') {
        const i = (cfg().instrumentos || []).find(x => x.id === b.dataset.id);
        if (!i) return;
        const ja = r.instrumentos.findIndex(x => x.id === i.id);
        if (ja >= 0) r.instrumentos.splice(ja, 1);
        else {
          if (i.validade && i.validade < (r.dataInspecao || u.hojeISO())) ui.toast('Atenção: ' + i.codigo + ' está com a calibração vencida.', 'erro');
          r.instrumentos.push({ id: i.id, codigo: i.codigo, descricao: i.descricao, validade: i.validade || '' });
        }
        pintarInstr(); atualizarResumo(); E.salvar();
      } else if (acao === 'foto-del') {
        if (!(await ui.confirmar('Remover esta foto?', { titulo: 'Remover foto', ok: 'Remover', perigo: true }))) return;
        r.fotos = r.fotos.filter(f => f.id !== b.dataset.id);
        pintarFotos(); atualizarResumo(); E.salvar();
      } else if (acao === 'res') {
        r.resultado = r.resultado === b.dataset.v ? null : b.dataset.v;
        E.main.querySelectorAll('.res-btn').forEach(x => x.classList.toggle('sel', x.dataset.v === r.resultado));
        atualizarResumo(); E.salvar();
      } else if (acao === 'assin-limpar') {
        r.assinatura = null;
        if (E.prepararAssinatura) E.prepararAssinatura();
        E.salvar();
      } else if (acao === 'imprimir') {
        E.salvar.flush(); await E.gravando;
        RIF.relatorio.imprimir(r, RIF.app.ctxRelatorio());
      } else if (acao === 'excluir') {
        if (!(await ui.confirmar('Excluir este rascunho? Esta ação não pode ser desfeita.', { titulo: 'Excluir rascunho', ok: 'Excluir', perigo: true }))) return;
        E.salvar = Object.assign(() => {}, { flush: () => {} });
        await E.gravando;
        await RIF.db.relatorios.excluir(r.id);
        ui.toast('Rascunho excluído.', 'ok');
        location.hash = '#/relatorios';
      } else if (acao === 'finalizar') {
        finalizar();
      }
    });

    E.aoRedimensionar = u.debounce(() => { ajustarLayoutDim(); if (E.prepararAssinatura) E.prepararAssinatura(); }, 150);
    window.addEventListener('resize', E.aoRedimensionar);
    if ('ResizeObserver' in window) {
      E.ro = new ResizeObserver(() => ajustarLayoutDim());
      E.ro.observe(m);
    }
  }

  /* =======================================================
     Finalização
     ======================================================= */
  function verificar(r) {
    const res = A.resumo(r), bloq = [], av = [];
    const p = r.produto;
    if (!r.cotas.length) bloq.push('Escolha o produto (seção 1).');
    if (!r.ident.quantidade) bloq.push('Informe a quantidade (seção 2).');
    if (!r.resultado) bloq.push('Marque o resultado: aprovado ou reprovado (seção 7).');
    if (!String(r.inspetor || '').trim()) bloq.push('Informe o nome do inspetor (seção 7).');
    if (r.resultado === 'aprovado' && res.sugestao === 'reprovado' && !String(r.observacoes || '').trim()) {
      bloq.push('Há não conformidades e o resultado é APROVADO: explique nas observações (ex.: concessão do cliente).');
    }
    const semJust = r.cotas.filter(c => c.sitManual === 'ok' && A.desvio(c) && !String(c.just || '').trim());
    if (semJust.length) bloq.push('Cota sem tolerância marcada conforme com desvio grande (' + semJust.map(c => c.cod).join(', ') + '): justifique em cada uma (botão "justificar") ou marque não conforme (seção 3).');
    const semMed = res.cotas.pendente + res.cotas.parcial;
    if (semMed) av.push(semMed + ' cota(s) sem todas as medições.');
    if (res.cotas.avaliar) av.push(res.cotas.avaliar + ' cota(s) sem avaliação do inspetor (sem tolerância na norma).');
    if (res.visual.pendente) av.push(res.visual.pendente + ' item(ns) da inspeção visual sem resposta.');
    if (!r.instrumentos.length) av.push('Nenhum instrumento de medição informado.');
    const venc = r.instrumentos.filter(i => i.validade && i.validade < (r.dataInspecao || u.hojeISO()));
    if (venc.length) av.push('Instrumento com calibração vencida: ' + venc.map(i => i.codigo).join(', ') + '.');
    if (p.modo === 'norma' && p.chave && !RIF.app.estado.validacoes[p.chave]) av.push('Combinação da norma ainda não validada pela Qualidade.');
    if (r.resultado === 'reprovado' && res.sugestao !== 'reprovado' && !String(r.observacoes || '').trim()) av.push('Reprovado sem não conformidade registrada: descreva o motivo nas observações.');
    if (r.ident.quantidade && r.pecas > +r.ident.quantidade) av.push('Foram medidas mais peças (' + r.pecas + ') do que a quantidade do lote (' + r.ident.quantidade + ').');
    return { bloq: bloq, av: av, res: res };
  }

  async function finalizar() {
    E.salvar.flush(); await E.gravando;
    const r = E.rel, v = verificar(r);
    if (v.bloq.length) {
      await ui.modal({
        titulo: 'Falta preencher',
        html: '<div class="checklist-fim">' + v.bloq.map(t => '<div class="aviso aviso-nc">' + ui.icon('alerta') + '<span>' + esc(t) + '</span></div>').join('') + '</div>',
        botoes: [{ rotulo: 'Voltar ao relatório', classe: 'btn-pri', valor: true }]
      });
      return;
    }
    const num = await RIF.db.config.obter('numeracao', null);
    const ano = new Date().getFullYear();
    const prox = (num && num.ano === ano ? num.ultimo : 0) + 1;
    const ok = await ui.modal({
      titulo: 'Finalizar relatório',
      html: '<p class="modal-texto">O relatório receberá o número <b>RIF-' + ano + '-' + u.pad(prox, 5) + '</b> e não poderá mais ser alterado.</p>' +
        '<div class="sugestao ' + (r.resultado === 'aprovado' ? 's-aprovado' : 's-reprovado') + '" style="margin:14px 0 0">' + ui.icon(r.resultado === 'aprovado' ? 'check' : 'x') + '<div><b>Resultado: ' + r.resultado.toUpperCase() + '</b><small>' + esc(r.produto.descricao || '') + '</small></div></div>' +
        (v.av.length ? '<div class="checklist-fim"><div class="rotulo" style="margin-top:6px">Confira antes de finalizar</div>' + v.av.map(t => '<div class="aviso aviso-av">' + ui.icon('alerta') + '<span>' + esc(t) + '</span></div>').join('') + '</div>' : ''),
      botoes: [
        { rotulo: 'Voltar', classe: 'btn-sec', valor: false },
        { rotulo: 'Finalizar', classe: 'btn-pri', icone: 'check', valor: true }
      ]
    });
    if (!ok) return;
    try {
      const val = r.produto.chave ? RIF.app.estado.validacoes[r.produto.chave] : null;
      r.produto.validacao = val ? { responsavel: val.responsavel, data: val.data, motivo: val.motivo || '', correcoes: N.contarCorrecoes(val) } : null;
      const fin = await RIF.db.relatorios.finalizar(r);
      E.salvar = Object.assign(() => {}, { flush: () => {} });
      ui.toast(fin.numero + ' finalizado.', 'ok');
      RIF.app.ir('#/rif/' + fin.id);
    } catch (e) {
      console.error(e);
      ui.alerta('Não foi possível finalizar: ' + e.message);
    }
  }

  return { render: render };
})();

/* ==========================================================
   RIF — lista de relatórios (rascunhos e finalizados)
   e visualização de relatório finalizado
   ========================================================== */
RIF.vHistorico = (function () {
  const u = RIF.u, ui = RIF.ui, esc = u.esc;
  let filtro = { aba: 'todos', texto: '' };

  function render(main) {
    main.innerHTML =
      '<div class="pag-cab"><div><h1>Relatórios</h1><p>Rascunhos em andamento e relatórios finalizados</p></div>' +
      '<a class="btn btn-pri" href="#/novo">' + ui.icon('plus') + 'Novo RIF</a></div>' +
      '<div class="busca">' + ui.icon('search') + '<input class="inp" type="search" id="h-busca" placeholder="Buscar por número, cliente, pedido, lote, corrida ou produto" value="' + esc(filtro.texto) + '"></div>' +
      '<div class="abas" id="h-abas" role="tablist"></div>' +
      '<div id="h-lista"></div>';
    let todos = [];
    RIF.db.relatorios.listar().then(l => { todos = l; pintar(); });

    function pintar() {
      const t = filtro.texto.trim().toLocaleUpperCase('pt-BR');
      const cont = { todos: todos.length, rascunho: 0, aprovado: 0, reprovado: 0 };
      todos.forEach(r => { if (r.status !== 'finalizado') cont.rascunho++; else if (r.resultado) cont[r.resultado]++; });
      document.getElementById('h-abas').innerHTML = [['todos', 'Todos'], ['rascunho', 'Rascunhos'], ['aprovado', 'Aprovados'], ['reprovado', 'Reprovados']]
        .map(a => '<button type="button" role="tab" data-aba="' + a[0] + '" class="' + (filtro.aba === a[0] ? 'sel' : '') + '">' + a[1] + '<span>' + cont[a[0]] + '</span></button>').join('');
      const lista = todos.filter(r => {
        if (filtro.aba === 'rascunho' && r.status === 'finalizado') return false;
        if ((filtro.aba === 'aprovado' || filtro.aba === 'reprovado') && (r.status !== 'finalizado' || r.resultado !== filtro.aba)) return false;
        if (!t) return true;
        const id = r.ident || {};
        return [r.numero, id.cliente, id.pv, id.lote, id.corrida, id.desenho, r.produto && r.produto.descricao, r.inspetor, id.material]
          .some(v => String(v || '').toLocaleUpperCase('pt-BR').indexOf(t) >= 0);
      });
      const area = document.getElementById('h-lista');
      if (!todos.length) {
        area.innerHTML = '<div class="vazio">' + ui.icon('doc') + '<h3>Nenhum relatório ainda</h3><p>Comece um novo relatório de inspeção final.</p><a class="btn btn-pri" href="#/novo">' + ui.icon('plus') + 'Novo RIF</a></div>';
        return;
      }
      if (!lista.length) { area.innerHTML = '<div class="vazio">' + ui.icon('search') + '<h3>Nada encontrado</h3><p>Tente outro termo ou outra aba.</p></div>'; return; }
      area.innerHTML = '<div class="hist-lista">' + lista.map(item).join('') + '</div>';
    }

    function item(r) {
      const id = r.ident || {};
      const fin = r.status === 'finalizado';
      const pill = !fin ? '<span class="pill pill-av">' + ui.icon('editar') + 'Em andamento</span>'
        : r.resultado === 'aprovado' ? '<span class="pill pill-ok">' + ui.icon('check') + 'Aprovado</span>'
        : '<span class="pill pill-nc">' + ui.icon('x') + 'Reprovado</span>';
      return '<a class="hist-item ' + (fin ? 'r-' + r.resultado : 'rascunho') + '" href="#/rif/' + r.id + '">' +
        '<div class="hist-l1"><b>' + esc(r.numero || 'Rascunho') + '</b>' + pill + '</div>' +
        '<div class="hist-prod">' + esc(r.produto && r.produto.descricao || 'Produto não escolhido') + '</div>' +
        '<div class="hist-meta">' +
          '<span>Cliente <b>' + esc(id.cliente || '—') + '</b></span>' +
          (id.pv ? '<span>PV <b>' + esc(id.pv) + '</b></span>' : '') +
          (id.quantidade ? '<span>Qtd <b>' + esc(id.quantidade) + '</b></span>' : '') +
          (id.lote ? '<span>Lote <b>' + esc(id.lote) + '</b></span>' : '') +
          '<span>' + esc(fin ? u.dataBR(r.dataInspecao) : 'editado ' + u.dataHoraBR(r.atualizadoEm)) + '</span>' +
        '</div></a>';
    }

    main.querySelector('#h-busca').addEventListener('input', u.debounce(e => { filtro.texto = e.target.value; pintar(); }, 150));
    main.querySelector('#h-abas').addEventListener('click', e => {
      const b = e.target.closest('[data-aba]');
      if (b) { filtro.aba = b.dataset.aba; pintar(); }
    });
    return null;
  }

  return { render: render };
})();

/* ---------- relatório finalizado (somente leitura) ---------- */
RIF.vRelatorio = (function () {
  const u = RIF.u, ui = RIF.ui, esc = u.esc;

  function render(main, rel) {
    const res = rel.resultado;
    main.innerHTML =
      '<div class="ver-cab"><div><div class="pill ' + (res === 'aprovado' ? 'pill-ok' : 'pill-nc') + '">' + ui.icon(res === 'aprovado' ? 'check' : 'x') + esc((res || '').toUpperCase()) + '</div>' +
      '<h1 style="margin-top:6px">' + esc(rel.numero) + '</h1><div class="ajuda">Finalizado em ' + esc(u.dataHoraBR(rel.finalizadoEm)) + ' · ' + esc(rel.inspetor || '') + '</div></div>' +
      '<div class="acoes"><button type="button" class="btn btn-sec" data-acao="duplicar">' + ui.icon('copy') + 'Duplicar</button>' +
      '<button type="button" class="btn btn-pri" data-acao="imprimir">' + ui.icon('printer') + 'Imprimir / PDF</button></div></div>' +
      '<div class="aviso" style="margin-bottom:12px">' + ui.icon('cadeado') + '<span>Relatório finalizado e assinado: não pode ser alterado. Se precisar inspecionar de novo, use <b>Reinspecionar</b> no pedido.</span></div>' +
      '<div class="papel">' + RIF.relatorio.html(rel, RIF.app.ctxRelatorio()) + '</div>';
    main.addEventListener('click', async e => {
      const b = e.target.closest('[data-acao]');
      if (!b) return;
      if (b.dataset.acao === 'imprimir') RIF.relatorio.imprimir(rel, RIF.app.ctxRelatorio());
      if (b.dataset.acao === 'duplicar') {
        const novo = await RIF.app.novoRelatorio(rel);
        ui.toast('Cópia criada como rascunho. Confira os dados do novo lote.', 'ok');
        location.hash = '#/rif/' + novo.id;
      }
    });
    return null;
  }
  return { render: render };
})();

/* ==========================================================
   RIF — configurações (protegidas por senha)
   ========================================================== */
RIF.vConfig = (function () {
  const u = RIF.u, ui = RIF.ui, N = RIF.normas, esc = u.esc;
  const st = () => RIF.app.estado;
  const cfg = () => RIF.app.estado.cfg;
  let main = null;

  function render(m) {
    main = m;
    if (!st().cfgLiberado) pintarBloqueio(); else pintar();
    main.addEventListener('click', aoClicar);
    main.addEventListener('change', aoMudar);
    return null;
  }

  /* ---------------- senha ---------------- */
  function pintarBloqueio() {
    main.innerHTML = '<div class="cfg-bloqueio card"><div class="card-corpo">' +
      ui.icon('cadeado', 'ico-grande') + '<h1>Configurações</h1><p>Área da Qualidade. Digite a senha para continuar.</p>' +
      '<form id="f-senha"><input class="inp inp-senha" type="password" inputmode="numeric" id="senha" autocomplete="current-password" placeholder="••••••" aria-label="Senha">' +
      '<button class="btn btn-pri btn-bloco" style="margin-top:12px" type="submit">Entrar</button></form>' +
      '<p class="ajuda" style="margin-top:12px">' + esc(RIF.db.descricaoModo) + '. Com o Firebase, o acesso passa a ser pelo login de cada usuário.</p></div></div>';
    const f = main.querySelector('#f-senha');
    f.addEventListener('submit', e => {
      e.preventDefault();
      const v = main.querySelector('#senha').value;
      if (u.hash(v) === cfg().senhaHash) { st().cfgLiberado = true; pintar(); }
      else { ui.toast('Senha incorreta.', 'erro'); main.querySelector('#senha').value = ''; }
    });
    setTimeout(() => { const s = main.querySelector('#senha'); if (s) s.focus(); }, 50);
  }

  /* ---------------- tela principal ---------------- */
  function cartao(id, titulo, icone, corpo, dir) {
    return '<section class="card" id="cfg-' + id + '"><header class="card-cab"><span class="passo">' + ui.icon(icone) + '</span><h2>' + titulo + '</h2>' +
      (dir ? '<div class="card-cab-dir">' + dir + '</div>' : '') + '</header><div class="card-corpo">' + corpo + '</div></section>';
  }

  function pintar() {
    main.innerHTML = '<div class="pag-cab"><div><h1>Configurações do RIF</h1><p>' + (RIF.embed ? 'Normas e validação, inspeção visual, produtos manuais e código do formulário' : 'Cadastros, normas, numeração e backup') + '</p></div>' +
      '<button type="button" class="btn btn-sec" data-acao="bloquear">' + ui.icon('cadeado') + 'Bloquear</button></div>' +
      '<div class="cfg-grade">' +
        cartao('instr', 'Instrumentos de medição', 'instrumento', htmlInstrumentos()) +
        cartao('normas', 'Normas e validação', 'livro', htmlNormas()) +
        cartao('checklist', 'Itens da inspeção visual', 'visual', htmlChecklist()) +
        cartao('produtos', 'Produtos manuais (desenho / norma)', 'caixa', htmlProdutos()) +
        cartao('inspetores', 'Inspetores', 'usuario', htmlInspetores()) +
        cartao('empresa', 'Empresa e relatório', 'doc', htmlEmpresa()) +
        cartao('numeracao', 'Numeração dos RIF', 'lista', '<div id="num-corpo">Carregando…</div>') +
        cartao('backup', 'Backup dos dados', 'download', htmlBackup()) +
        cartao('seguranca', 'Senha', 'cadeado', htmlSenha()) +
      '</div>';
    pintarNumeracao();
  }

  function repintar(id, html) { const el = main.querySelector('#cfg-' + id + ' .card-corpo'); if (el) el.innerHTML = html; }

  /* ---------------- instrumentos ---------------- */
  function htmlInstrumentos() {
    const l = cfg().instrumentos || [];
    const itens = l.length ? l.map(i => {
      const d = u.diasAte(i.validade);
      const pill = !i.validade ? '<span class="pill">Sem validade</span>' : d < 0 ? '<span class="pill pill-nc">Vencido</span>' : d <= 30 ? '<span class="pill pill-av">Vence em ' + d + ' d</span>' : '<span class="pill pill-ok">Válido</span>';
      return '<div class="item"><div class="txt"><b>' + esc(i.codigo) + ' — ' + esc(i.descricao) + '</b><span>Calibração válida até ' + esc(u.dataBR(i.validade)) + '</span></div>' + pill +
        '<button type="button" class="btn-icone" data-acao="instr-edit" data-id="' + i.id + '" aria-label="Editar">' + ui.icon('editar') + '</button>' +
        '<button type="button" class="btn-icone perigo" data-acao="instr-del" data-id="' + i.id + '" aria-label="Remover">' + ui.icon('trash') + '</button></div>';
    }).join('') : '<div class="vazio-p">Nenhum instrumento cadastrado.</div>';
    return '<div class="lista-edit">' + itens + '</div>' +
      '<button type="button" class="btn btn-sec btn-bloco" style="margin-top:10px" data-acao="instr-novo">' + ui.icon('plus') + 'Novo instrumento</button>';
  }

  async function editarInstrumento(id) {
    const l = cfg().instrumentos || [];
    const atual = l.find(i => i.id === id) || { codigo: '', descricao: '', validade: '' };
    const v = await ui.modal({
      titulo: id ? 'Editar instrumento' : 'Novo instrumento',
      html: '<div class="campos" style="grid-template-columns:1fr">' +
        '<div class="campo"><label>Código / identificação</label><input class="inp maiusc" id="i-cod" value="' + esc(atual.codigo) + '" placeholder="Ex.: PAQ-012"></div>' +
        '<div class="campo"><label>Descrição</label><input class="inp maiusc" id="i-desc" value="' + esc(atual.descricao) + '" placeholder="Ex.: Paquímetro digital 0–300 mm"></div>' +
        '<div class="campo"><label>Calibração válida até</label><input class="inp" type="date" id="i-val" value="' + esc(atual.validade || '') + '"></div></div>',
      botoes: [
        { rotulo: 'Cancelar', classe: 'btn-sec', valor: null },
        { rotulo: 'Salvar', classe: 'btn-pri', acao: c => {
          const cod = u.maiusc(c.querySelector('#i-cod').value.trim());
          const desc = u.maiusc(c.querySelector('#i-desc').value.trim());
          if (!cod || !desc) { ui.toast('Preencha código e descrição.', 'erro'); return false; }
          return { codigo: cod, descricao: desc, validade: c.querySelector('#i-val').value };
        } }
      ]
    });
    if (!v) return;
    const nova = l.slice();
    if (id) Object.assign(nova.find(i => i.id === id), v);
    else nova.push(Object.assign({ id: u.uid() }, v));
    nova.sort((a, b) => a.codigo.localeCompare(b.codigo));
    await RIF.app.salvarConfig('instrumentos', nova);
    repintar('instr', htmlInstrumentos());
    ui.toast('Instrumento salvo.', 'ok');
  }

  /* ---------------- inspetores ---------------- */
  function htmlInspetores() {
    const l = cfg().inspetores || [];
    return '<div class="lista-edit">' + (l.length ? l.map(i => '<div class="item"><div class="txt"><b>' + esc(i.nome) + '</b></div>' +
      '<button type="button" class="btn-icone perigo" data-acao="insp-del" data-id="' + i.id + '" aria-label="Remover">' + ui.icon('trash') + '</button></div>').join('')
      : '<div class="vazio-p">Nenhum inspetor cadastrado. A lista aparece como sugestão no campo Inspetor.</div>') + '</div>' +
      '<form class="linha-add" data-form="insp"><input class="inp maiusc" name="nome" placeholder="Nome do inspetor" autocomplete="off"><button class="btn btn-pri" type="submit">' + ui.icon('plus') + 'Adicionar</button></form>';
  }

  /* ---------------- checklist visual ---------------- */
  function htmlChecklist() {
    const l = cfg().checklist || [];
    return '<p class="ajuda" style="margin-bottom:10px">Vale para os novos relatórios. Itens que não se aplicam ao produto são marcados N/A.</p>' +
      '<div class="lista-edit">' + (l.length ? l.map((i, k) => '<div class="item"><div class="txt"><b style="font-weight:550">' + esc(i.texto) + '</b></div>' +
      '<button type="button" class="btn-icone" data-acao="chk-sobe" data-k="' + k + '" aria-label="Subir"' + (k === 0 ? ' disabled' : '') + '>' + ui.icon('cima') + '</button>' +
      '<button type="button" class="btn-icone" data-acao="chk-desce" data-k="' + k + '" aria-label="Descer"' + (k === l.length - 1 ? ' disabled' : '') + '>' + ui.icon('baixo') + '</button>' +
      '<button type="button" class="btn-icone perigo" data-acao="chk-del" data-k="' + k + '" aria-label="Remover">' + ui.icon('trash') + '</button></div>').join('')
      : '<div class="vazio-p">Nenhum item.</div>') + '</div>' +
      '<form class="linha-add" data-form="chk"><input class="inp" name="texto" placeholder="Novo item de verificação" autocomplete="off"><button class="btn btn-pri" type="submit">' + ui.icon('plus') + 'Adicionar</button></form>' +
      '<button type="button" class="btn btn-fantasma btn-peq" style="margin-top:8px" data-acao="chk-padrao">Restaurar lista padrão</button>';
  }

  /* ---------------- produtos manuais (desenho, peça especial ou norma digitada) ---------------- */
  function textoCotaProduto(c) {
    const vz = v => v === null || v === undefined || v === '';
    if (vz(c.nominal)) return '';
    const sup = vz(c.sup) ? null : +c.sup, inf = vz(c.inf) ? null : +c.inf;
    let t = u.fmt(c.nominal);
    if (sup !== null || inf !== null) t += sup !== null && inf !== null && Math.abs(sup - inf) < 1e-9 ? ' ± ' + u.fmt(sup) : ' +' + u.fmt(sup || 0) + '/−' + u.fmt(inf || 0);
    return t;
  }

  function htmlProdutos() {
    const l = cfg().produtos || [];
    return '<p class="ajuda" style="margin-bottom:10px">Para norma que ainda não está no app, desenho ou peça especial. Cadastre as cotas com nominal e tolerância (opcionais): no relatório, em <b>Manual / desenho</b>, os valores já vêm preenchidos e o inspetor pode ajustar.</p>' +
      '<div class="lista-edit">' + (l.length ? l.map(p => '<div class="item"><div class="txt"><b>' + esc(p.nome) + '</b><span>' + (p.referencia ? esc(p.referencia) + ' · ' : '') +
        p.cotas.length + ' cota(s): ' + esc(p.cotas.map(c => c.cod).join(', ')) + '</span></div>' +
      '<button type="button" class="btn-icone" data-acao="prod-edit" data-id="' + p.id + '" aria-label="Editar">' + ui.icon('editar') + '</button>' +
      '<button type="button" class="btn-icone perigo" data-acao="prod-del" data-id="' + p.id + '" aria-label="Remover">' + ui.icon('trash') + '</button></div>').join('')
      : '<div class="vazio-p">Nenhum produto cadastrado.</div>') + '</div>' +
      '<button type="button" class="btn btn-sec btn-bloco" style="margin-top:10px" data-acao="prod-novo">' + ui.icon('plus') + 'Novo produto</button>';
  }

  async function editarProduto(id) {
    const l = cfg().produtos || [];
    const atual = u.clonar(l.find(p => p.id === id) || { nome: '', referencia: '', cotas: [] });
    const num = v => { const x = u.num(v); return isNaN(x) ? null : x; };
    const entrada = (k, f, v, ph, cls, extra) => '<input class="inp ' + (cls || '') + '" data-pk="' + k + '" data-pf="' + f + '" value="' + esc(v) + '" placeholder="' + ph + '"' + (extra || '') + '>';
    function linhas() {
      if (!atual.cotas.length) return '<div class="vazio-p">Nenhuma cota.</div>';
      return '<div class="pc-cab"><span>Cód.</span><span>Descrição</span><span>Nominal</span><span>Tol. +</span><span>Tol. −</span><span></span></div>' +
        atual.cotas.map((c, k) => '<div class="pc-linha">' +
          entrada(k, 'cod', c.cod, 'Cód.', 'maiusc pc-cod', ' maxlength="6" aria-label="Código"') +
          entrada(k, 'desc', c.desc, 'Descrição', 'maiusc pc-desc', ' aria-label="Descrição da cota"') +
          entrada(k, 'nominal', u.fmtEntrada(c.nominal), 'Nominal', 'pc-num', ' inputmode="decimal" aria-label="Nominal"') +
          entrada(k, 'sup', u.fmtEntrada(c.sup), '+', 'pc-num', ' inputmode="decimal" aria-label="Tolerância superior"') +
          entrada(k, 'inf', u.fmtEntrada(c.inf), '−', 'pc-num', ' inputmode="decimal" aria-label="Tolerância inferior"') +
          '<button type="button" class="btn-icone perigo" data-k="' + k + '" data-del-cota aria-label="Remover cota">' + ui.icon('trash') + '</button></div>').join('');
    }
    const v = await ui.modal({
      titulo: id ? 'Editar produto' : 'Novo produto',
      largo: true,
      html: '<div class="campos" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">' +
        '<div class="campo"><label>Nome do produto</label><input class="inp maiusc" id="p-nome" value="' + esc(atual.nome) + '" placeholder="Ex.: Flange 6&quot; classe 125"></div>' +
        '<div class="campo"><label>Norma ou referência <span class="opc">(opcional)</span></label><input class="inp maiusc" id="p-ref" value="' + esc(atual.referencia || '') + '" placeholder="Ex.: MSS SP-44, desenho DES-120"></div></div>' +
        '<div class="rotulo" style="margin:14px 0 8px">Cotas <span class="opc">— nominal e tolerância são opcionais</span></div><div class="pc-lista" id="p-cotas">' + linhas() + '</div>' +
        '<div class="pc-add"><input class="inp maiusc pc-cod" id="p-cod" maxlength="6" placeholder="Cód.">' +
        '<input class="inp maiusc pc-desc" id="p-desc" placeholder="Descrição da cota">' +
        '<input class="inp pc-num" id="p-nom" inputmode="decimal" placeholder="Nominal">' +
        '<input class="inp pc-num" id="p-sup" inputmode="decimal" placeholder="Tol. +">' +
        '<input class="inp pc-num" id="p-inf" inputmode="decimal" placeholder="Tol. −">' +
        '<button type="button" class="btn btn-sec" id="p-add">' + ui.icon('plus') + 'Cota</button></div>',
      aoAbrir: caixa => {
        const lista = caixa.querySelector('#p-cotas');
        caixa.querySelector('#p-add').onclick = () => {
          const q = s => caixa.querySelector(s);
          const cod = u.maiusc(q('#p-cod').value.trim()), desc = u.maiusc(q('#p-desc').value.trim());
          if (!cod || !desc) { ui.toast('Preencha código e descrição da cota.', 'erro'); return; }
          atual.cotas.push({ cod: cod, desc: desc, nominal: num(q('#p-nom').value), sup: num(q('#p-sup').value), inf: num(q('#p-inf').value) });
          ['#p-cod', '#p-desc', '#p-nom', '#p-sup', '#p-inf'].forEach(s => { q(s).value = ''; });
          lista.innerHTML = linhas();
          q('#p-cod').focus();
        };
        lista.addEventListener('input', e => {
          const t = e.target;
          if (t.dataset.pk === undefined) return;
          const c = atual.cotas[+t.dataset.pk], f = t.dataset.pf;
          if (f === 'cod' || f === 'desc') c[f] = u.maiusc(t.value.trim());
          else {
            const limpo = u.limparMedida(t.value).replace('-', '');
            if (limpo !== t.value) t.value = limpo;
            c[f] = num(limpo);
          }
        });
        lista.addEventListener('click', e => {
          const b = e.target.closest('[data-del-cota]');
          if (b) { atual.cotas.splice(+b.dataset.k, 1); lista.innerHTML = linhas(); }
        });
      },
      botoes: [
        { rotulo: 'Cancelar', classe: 'btn-sec', valor: null },
        { rotulo: 'Salvar', classe: 'btn-pri', acao: c => {
          const nome = u.maiusc(c.querySelector('#p-nome').value.trim());
          if (!nome) { ui.toast('Digite o nome do produto.', 'erro'); return false; }
          if (!atual.cotas.length) { ui.toast('Adicione pelo menos uma cota.', 'erro'); return false; }
          const ruim = atual.cotas.find(x => !x.cod || !x.desc);
          if (ruim) { ui.toast('Toda cota precisa de código e descrição.', 'erro'); return false; }
          return { nome: nome, referencia: u.maiusc(c.querySelector('#p-ref').value.trim()), cotas: atual.cotas };
        } }
      ]
    });
    if (!v) return;
    const nova = l.slice();
    if (id) Object.assign(nova.find(p => p.id === id), v);
    else nova.push(Object.assign({ id: u.uid() }, v));
    await RIF.app.salvarConfig('produtos', nova);
    repintar('produtos', htmlProdutos());
    ui.toast('Produto salvo.', 'ok');
  }

  /* ---------------- normas e validações ---------------- */
  function htmlNormas() {
    const val = st().validacoes;
    const normas = N.todas();
    const chaves = Object.keys(val).sort();
    return normas.map(n => '<div class="norma-item"><b>' + esc(N.nome(n)) + '</b><span>' + esc(n.titulo) + ' · ' + N.contarCombinacoes(n) + ' combinações · ' +
        (n.toleranciasConferidas === false ? 'tolerâncias provisórias' : 'tolerâncias da norma') + '</span></div>').join('') +
      '<button type="button" class="btn btn-pri btn-bloco" style="margin:6px 0 14px" data-acao="validar">' + ui.icon('escudo') + 'Validar combinação</button>' +
      '<div class="rotulo" style="margin-bottom:8px">Combinações validadas (' + chaves.length + ')</div>' +
      '<div class="lista-edit">' + (chaves.length ? chaves.map(k => {
        const v = val[k], nc = N.contarCorrecoes(v);
        return '<div class="item"><div class="txt"><b>' + esc(N.rotuloChave(k)) + '</b><span>' + esc(v.responsavel) + ' · ' + esc(v.data) +
          (nc ? ' · <em class="txt-corr">' + nc + (nc > 1 ? ' valores corrigidos' : ' valor corrigido') + '</em>' : '') + '</span></div>' +
          '<button type="button" class="btn-icone" data-acao="val-edit" data-k="' + esc(k) + '" aria-label="Ver ou corrigir os valores">' + ui.icon('editar') + '</button>' +
          '<button type="button" class="btn-icone perigo" data-acao="val-del" data-k="' + esc(k) + '" aria-label="Remover validação">' + ui.icon('trash') + '</button></div>';
      }).join('')
        : '<div class="vazio-p">Nenhuma ainda. Valide cada combinação depois de conferir os valores com a norma física. Se algum valor estiver errado, corrija na própria validação.</div>') + '</div>';
  }

  /** Conferência de uma combinação com a norma física. A Qualidade pode corrigir nominal e tolerância
      de qualquer cota antes de validar; a correção vale para os relatórios novos (e rascunhos abertos). */
  async function validarCombinacao(chavePre) {
    const normas = N.todas();
    if (!normas.length) return;
    let n = normas[0];
    const sel = {};
    const pre = chavePre ? N.selecaoDaChave(chavePre) : null;
    if (pre) { n = pre.norma; Object.assign(sel, pre.sel); }
    let editando = false, valores = null, base = [], motivo = '';
    const num = v => { const x = u.num(v); return isNaN(x) ? null : x; };
    const chaveAtual = () => N.selecaoCompleta(n, sel) ? N.chave(n, sel) : null;
    const vazioNum = v => v === null || v === undefined || v === '';

    function valoresIniciais(val) {
      const v = {};
      base.forEach(c => {
        const k = N.chaveCota(c), t = N.tolEfetiva(c), x = val && val.correcoes && val.correcoes[k];
        v[k] = N.correcaoMuda(c, x) ? { nominal: num(x.nominal), sup: num(x.tolSup), inf: num(x.tolInf) }
                                     : { nominal: vazioNum(c.nominal) ? null : +c.nominal, sup: t.sup, inf: t.inf };
      });
      return v;
    }
    const alterada = c => { const v = valores[N.chaveCota(c)]; return N.correcaoMuda(c, { nominal: v.nominal, tolSup: v.sup, tolInf: v.inf }); };
    const temAlteracao = () => !!valores && base.some(alterada);

    function corpo() {
      let h = '<div class="campos" style="grid-template-columns:1fr">';
      if (normas.length > 1) h += '<div class="campo"><label>Norma</label><select class="inp" data-v-norma>' + normas.map(x => '<option value="' + esc(x.id) + '"' + (x === n ? ' selected' : '') + '>' + esc(N.nome(x)) + '</option>').join('') + '</select></div>';
      n.seletores.forEach((s, i) => {
        const lib = n.seletores.slice(0, i).every(x => sel[x.id]);
        const ops = lib ? N.opcoes(n, i, sel) : [];
        h += '<div class="campo"><label>' + esc(s.rotulo) + '</label><select class="inp" data-v-sel="' + esc(s.id) + '"' + (lib ? '' : ' disabled') + '><option value="">—</option>' +
          ops.map(o => '<option value="' + esc(o.valor) + '"' + (o.valor === sel[s.id] ? ' selected' : '') + '>' + esc(o.rotulo) + '</option>').join('') + '</select></div>';
      });
      h += '</div><div id="v-tabela" style="margin-top:12px"></div>' +
        '<div class="campo" style="margin-top:12px"><label>Responsável pela conferência</label><input class="inp maiusc" id="v-resp" placeholder="Seu nome" value="' + esc(RIF.hostMe()) + '"' + (RIF.embed ? ' readonly title="Quem está logado na Central"' : '') + '></div>';
      return h;
    }

    function campoNum(k, f, valor, rotulo) {
      if (!editando) return '<b>' + (valor === null ? '—' : esc(u.fmt(valor))) + '</b>';
      return '<input class="inp-num peq" inputmode="decimal" autocomplete="off" data-vc="' + esc(k) + '" data-f="' + f + '" value="' +
        esc(valor === null ? '' : u.fmtEntrada(valor)) + '" aria-label="' + esc(rotulo) + '">';
    }

    function linhaValor(c) {
      const k = N.chaveCota(c), v = valores[k], alt = alterada(c);
      const crit = c.criterio === 'min' ? ' mín.' : c.criterio === 'max' ? ' máx.' : '';
      let h = '<div class="val-linha' + (alt ? ' alterada' : '') + '" data-vl="' + esc(k) + '"><span class="dim-cod">' + esc(c.cod) + '</span>' +
        '<div class="val-desc">' + esc(c.desc) + '<small data-vn="' + esc(k) + '">' + (alt ? 'Na norma: ' + esc(N.textoValorCota(c)) : '') + '</small></div>' +
        '<div class="val-num"><span class="rot">Nominal' + crit + '</span>' +
        (vazioNum(c.nominal) ? '<b title="Valor do pedido">pedido</b>' : campoNum(k, 'nominal', v.nominal, c.cod + ' nominal')) + '</div>';
      if (c.criterio === 'exato') h += '<div class="val-num val-2"><span class="rot">Tolerância</span><b>exato</b></div>';
      else if (c.tolPct && vazioNum(c.nominal)) h += '<div class="val-num val-2"><span class="rot">Tolerância</span><b>' + esc(RIF.aval.textoTol(c)) + '</b></div>';
      else h +='<div class="val-num"><span class="rot">Tol. +</span>' + campoNum(k, 'sup', v.sup, c.cod + ' tolerância superior') + '</div>' +
                '<div class="val-num"><span class="rot">Tol. −</span>' + campoNum(k, 'inf', v.inf, c.cod + ' tolerância inferior') + '</div>';
      return h + '</div>';
    }

    function atualizarRodape(caixa) {
      const b = caixa.querySelector('.modal-rodape .btn-ok');
      if (b) b.innerHTML = ui.icon('escudo') + (temAlteracao() ? 'Salvar correção e validar' : 'Marcar como validado');
      const m = caixa.querySelector('#v-motivo-campo');
      if (m) m.style.display = editando || temAlteracao() ? '' : 'none';
    }

    function tabela(caixa) {
      const alvo = caixa.querySelector('#v-tabela');
      const ch = chaveAtual();
      if (!ch) { alvo.innerHTML = ''; base = []; valores = null; atualizarRodape(caixa); return; }
      const val = st().validacoes[ch];
      base = N.cotas(n, sel);
      if (!valores) { valores = valoresIniciais(val); motivo = val && N.contarCorrecoes(val) ? (val.motivo || '') : ''; }
      const nc = N.contarCorrecoes(val);
      let h = '';
      if (val) h += '<div class="aviso aviso-ok" style="margin-bottom:8px">' + ui.icon('escudo') + '<span>Já validada por <b>' + esc(val.responsavel) + '</b> em ' + esc(val.data) +
        (nc ? ', com ' + nc + (nc > 1 ? ' valores corrigidos' : ' valor corrigido') : '') + '. Salvar de novo substitui esta validação.</span></div>';
      h += '<div class="aviso" style="margin-bottom:10px">' + ui.icon('livro') + '<span>' + (editando
        ? 'Corrija só o que estiver diferente da norma física. As linhas alteradas ficam em destaque e a correção passa a valer nos relatórios.'
        : 'Confira cada valor abaixo com a norma física antes de validar. Se algum estiver errado, toque em <b>Corrigir valores</b>.') + '</span></div>';
      h += '<div class="val-lista"><div class="val-cab"><span>Cód.</span><span>Cota</span><span>Nominal</span><span>Tol. +</span><span>Tol. −</span></div>' +
        base.map(linhaValor).join('') + '</div>';
      h += '<div class="val-acoes">' + (editando
        ? '<button type="button" class="btn btn-fantasma btn-peq" data-v-acao="restaurar">' + ui.icon('back') + 'Voltar aos valores da norma</button>'
        : '<button type="button" class="btn btn-sec btn-peq" data-v-acao="corrigir">' + ui.icon('editar') + 'Corrigir valores</button>') + '</div>';
      h += '<div class="campo" id="v-motivo-campo" style="margin-top:12px"><label for="v-motivo">Motivo da correção</label>' +
        '<input class="inp" id="v-motivo" value="' + esc(motivo) + '" placeholder="Ex.: conferido na norma física, Tabela 9"></div>' +
        (N.notaRegistro(n, sel) ? '<p class="ajuda" style="margin-top:8px">' + esc(N.notaRegistro(n, sel)) + '</p>' : '');
      alvo.innerHTML = h;
      atualizarRodape(caixa);
    }

    const v = await ui.modal({
      titulo: 'Validar combinação da norma',
      largo: true,
      html: '<div id="v-corpo">' + corpo() + '</div>',
      aoAbrir: caixa => {
        if (pre) tabela(caixa);
        caixa.addEventListener('change', e => {
          const t = e.target;
          if (t.dataset.vNorma !== undefined) { n = N.obter(t.value); Object.keys(sel).forEach(k => delete sel[k]); }
          else if (t.dataset.vSel) {
            sel[t.dataset.vSel] = t.value;
            const i = n.seletores.findIndex(s => s.id === t.dataset.vSel);
            n.seletores.slice(i + 1).forEach(s => delete sel[s.id]);
          } else return;
          editando = false; valores = null; motivo = '';
          const resp = caixa.querySelector('#v-resp').value;
          caixa.querySelector('#v-corpo').innerHTML = corpo();
          caixa.querySelector('#v-resp').value = resp;
          tabela(caixa);
        });
        caixa.addEventListener('input', e => {
          const t = e.target;
          if (t.id === 'v-motivo') { motivo = t.value; return; }
          if (!t.dataset.vc) return;
          const limpo = u.limparMedida(t.value).replace('-', '');
          if (limpo !== t.value) t.value = limpo;
          valores[t.dataset.vc][t.dataset.f] = num(limpo);
          const c = base.find(x => N.chaveCota(x) === t.dataset.vc);
          const alt = alterada(c);
          caixa.querySelector('[data-vl="' + t.dataset.vc + '"]').classList.toggle('alterada', alt);
          caixa.querySelector('[data-vn="' + t.dataset.vc + '"]').textContent = alt ? 'Na norma: ' + N.textoValorCota(c) : '';
          atualizarRodape(caixa);
        });
        caixa.addEventListener('click', e => {
          const b = e.target.closest('[data-v-acao]');
          if (!b) return;
          if (b.dataset.vAcao === 'corrigir') editando = true;
          if (b.dataset.vAcao === 'restaurar') { valores = valoresIniciais(null); motivo = ''; }
          tabela(caixa);
          const prim = caixa.querySelector('[data-vc]');
          if (b.dataset.vAcao === 'corrigir' && prim) prim.focus();
        });
      },
      botoes: [
        { rotulo: 'Cancelar', classe: 'btn-sec', valor: null },
        { rotulo: 'Marcar como validado', classe: 'btn-ok', icone: 'escudo', acao: c => {
          if (!N.selecaoCompleta(n, sel)) { ui.toast('Escolha a combinação completa.', 'erro'); return false; }
          const correcoes = {}, orig = {};
          for (const cc of base) {
            const k = N.chaveCota(cc), x = valores[k];
            if (!vazioNum(cc.nominal) && x.nominal === null) { ui.toast('Digite o nominal da cota ' + cc.cod + '.', 'erro'); return false; }
            if (alterada(cc)) { const t0 = N.tolEfetiva(cc); correcoes[k] = { nominal: x.nominal, tolSup: cc.criterio === 'exato' ? null : x.sup, tolInf: cc.criterio === 'exato' ? null : x.inf }; orig[k] = { nominal: vazioNum(cc.nominal) ? null : +cc.nominal, tolSup: t0.sup, tolInf: t0.inf }; }
          }
          const nCorr = Object.keys(correcoes).length;
          const mot = nCorr ? String(motivo || '').trim() : '';
          if (nCorr && !mot) { ui.toast('Informe o motivo da correção.', 'erro'); const m = c.querySelector('#v-motivo'); if (m) m.focus(); return false; }
          const resp = u.maiusc(c.querySelector('#v-resp').value.trim());
          if (!resp) { ui.toast('Informe o responsável.', 'erro'); return false; }
          return { chave: N.chave(n, sel), responsavel: resp, motivo: mot, correcoes: nCorr ? correcoes : null, orig: nCorr ? orig : null };
        } }
      ]
    });
    if (!v) return;
    const info = { responsavel: v.responsavel, data: new Date().toLocaleDateString('pt-BR'), em: new Date().toISOString() };
    if (v.correcoes) { info.correcoes = v.correcoes; info.motivo = v.motivo; info.orig = v.orig; }
    await RIF.db.validacoes.salvar(v.chave, info);
    st().validacoes[v.chave] = Object.assign({ chave: v.chave }, info);
    repintar('normas', htmlNormas());
    ui.toast(v.correcoes ? 'Correção salva e combinação validada.' : 'Combinação validada.', 'ok');
  }

      '<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn btn-sec" style="position:relative">' + ui.icon('upload') + 'Escolher imagem<input type="file" accept="image/*" data-acao-change="logo" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>' +

  /* ---------------- numeração ---------------- */

    const n = await RIF.db.config.obter('numeracao', null);
    const ano = new Date().getFullYear();
    const prox = (n && n.ano === ano ? n.ultimo : 0) + 1;
    const el = main.querySelector('#num-corpo');

    el.innerHTML = '<p style="margin-bottom:10px">Próximo número: <b style="font-size:18px">RIF-' + ano + '-' + u.pad(prox, 5) + '</b></p>' +
      '<p class="ajuda" style="margin-bottom:10px">A numeração reinicia a cada ano. Para continuar a sequência do app antigo, informe o próximo número.</p>' +
      '<form class="linha-add" data-form="numeracao"><input class="inp" name="prox" type="number" min="1" value="' + prox + '" aria-label="Próximo número"><button class="btn btn-sec" type="submit">Definir</button></form>';

  /* ---------------- eventos ---------------- */
  async function aoClicar(e) {
    const b = e.target.closest('[data-acao]');
    if (!b) return;
    const a = b.dataset.acao;
    if (a === 'bloquear') { st().cfgLiberado = false; pintarBloqueio(); return; }
    if (a === 'instr-novo') return editarInstrumento(null);
    if (a === 'instr-edit') return editarInstrumento(b.dataset.id);
    if (a === 'instr-del') {
      if (!(await ui.confirmar('Remover este instrumento da lista? Relatórios já feitos não mudam.', { titulo: 'Remover instrumento', ok: 'Remover', perigo: true }))) return;
      await RIF.app.salvarConfig('instrumentos', cfg().instrumentos.filter(i => i.id !== b.dataset.id));
      repintar('instr', htmlInstrumentos());
    }
    if (a === 'insp-del') {
      await RIF.app.salvarConfig('inspetores', cfg().inspetores.filter(i => i.id !== b.dataset.id));
      repintar('inspetores', htmlInspetores());
    }
    if (a === 'chk-sobe' || a === 'chk-desce') {
      const l = cfg().checklist.slice(), k = +b.dataset.k, j = a === 'chk-sobe' ? k - 1 : k + 1;
      if (j < 0 || j >= l.length) return;
      const t = l[k]; l[k] = l[j]; l[j] = t;
      await RIF.app.salvarConfig('checklist', l);
      repintar('checklist', htmlChecklist());
    }
    if (a === 'chk-del') {
      const l = cfg().checklist.slice(); l.splice(+b.dataset.k, 1);
      await RIF.app.salvarConfig('checklist', l);
      repintar('checklist', htmlChecklist());
    }
    if (a === 'chk-padrao') {
      if (!(await ui.confirmar('Substituir a lista atual pela lista padrão?', { titulo: 'Restaurar lista', ok: 'Restaurar' }))) return;
      await RIF.app.salvarConfig('checklist', RIF.app.CHECKLIST_PADRAO.map(t => ({ id: u.uid(), texto: t })));
      repintar('checklist', htmlChecklist());
    }
    if (a === 'prod-novo') return editarProduto(null);
    if (a === 'prod-edit') return editarProduto(b.dataset.id);
    if (a === 'prod-del') {
      if (!(await ui.confirmar('Remover este produto?', { titulo: 'Remover produto', ok: 'Remover', perigo: true }))) return;
      await RIF.app.salvarConfig('produtos', cfg().produtos.filter(p => p.id !== b.dataset.id));
      repintar('produtos', htmlProdutos());
    }
    if (a === 'validar') return validarCombinacao();
    if (a === 'val-edit') return validarCombinacao(b.dataset.k);
    if (a === 'val-del') {
      const comCorr = N.contarCorrecoes(st().validacoes[b.dataset.k]) > 0;
      if (!(await ui.confirmar(comCorr ? 'Remover esta validação? As correções de valores feitas nela também saem, e os relatórios novos voltam a usar os valores da norma.' : 'Remover esta validação?', { titulo: 'Remover validação', ok: 'Remover', perigo: true }))) return;
      await RIF.db.validacoes.remover(b.dataset.k);
      delete st().validacoes[b.dataset.k];
      repintar('normas', htmlNormas());
    }
    if (a === 'logo-del') {
      await RIF.app.salvarConfig('empresa', Object.assign({}, cfg().empresa, { logo: null }));
      repintar('empresa', htmlEmpresa());
    }
    if (a === 'exportar') {
      const dados = await RIF.db.backup.exportar();
      u.baixarArquivo('rif-backup-' + u.hojeISO() + '.json', JSON.stringify(dados), 'application/json');
      ui.toast('Backup exportado (' + dados.relatorios.length + ' relatórios).', 'ok');
    }
  }

  async function aoMudar(e) {
    const t = e.target;
    if (t.dataset.acaoChange === 'logo' && t.files && t.files[0]) {
      try {
        const img = await u.comprimirImagem(t.files[0], 500, 0.9);
        await RIF.app.salvarConfig('empresa', Object.assign({}, cfg().empresa, { logo: img }));
        repintar('empresa', htmlEmpresa());
        ui.toast('Logo atualizado.', 'ok');
      } catch (err) { ui.toast(err.message, 'erro'); }
    }
    if (t.dataset.acaoChange === 'importar' && t.files && t.files[0]) {
      try {
        const dados = JSON.parse(await t.files[0].text());
        if (!(await ui.confirmar('Importar o backup? Rascunhos e configurações com o mesmo identificador serão substituídos. Relatórios finalizados existentes não são alterados.', { titulo: 'Importar backup', ok: 'Importar' }))) return;
        const n = await RIF.db.backup.importar(dados);
        await RIF.app.carregarConfig();
        pintar();
        ui.toast(n + ' relatório(s) importado(s).', 'ok');
      } catch (err) { ui.alerta('Não foi possível importar: ' + err.message); }
      t.value = '';
    }
  }

  // formulários (submit)
  document.addEventListener('submit', async e => {
    const f = e.target.closest('[data-form]');
    if (!f || !main || !main.contains(f)) return;
    e.preventDefault();
    const tipo = f.dataset.form, val = n => (f.elements[n] ? f.elements[n].value : '');
    if (tipo === 'insp') {
      const nome = u.maiusc(val('nome').trim()); if (!nome) return;
      await RIF.app.salvarConfig('inspetores', (cfg().inspetores || []).concat([{ id: u.uid(), nome: nome }]));
      repintar('inspetores', htmlInspetores());
      main.querySelector('[data-form="insp"] input').focus();
    }
    if (tipo === 'chk') {
      const texto = val('texto').trim(); if (!texto) return;
      await RIF.app.salvarConfig('checklist', (cfg().checklist || []).concat([{ id: u.uid(), texto: texto }]));
      repintar('checklist', htmlChecklist());
      main.querySelector('[data-form="chk"] input').focus();
    }
    if (tipo === 'empresa') {
      await RIF.app.salvarConfig('empresa', Object.assign({}, cfg().empresa, {
        nome: val('nome').trim() || 'Aços Vital', sigla: u.maiusc(val('sigla').trim()) || 'AV', codigoFormulario: u.maiusc(val('codigo').trim())
      }));
      await RIF.app.salvarConfig('pecasPadrao', Math.max(1, Math.min(10, parseInt(val('pecas'), 10) || 3)));
      ui.toast('Dados da empresa salvos.', 'ok');
    }
    if (tipo === 'numeracao') {
      const prox = parseInt(val('prox'), 10);
      if (!(prox >= 1)) { ui.toast('Número inválido.', 'erro'); return; }
      if (!(await ui.confirmar('O próximo relatório finalizado será RIF-' + new Date().getFullYear() + '-' + u.pad(prox, 5) + '. Confirmar?', { titulo: 'Definir numeração', ok: 'Confirmar' }))) return;
      await RIF.db.config.salvar('numeracao', { ano: new Date().getFullYear(), ultimo: prox - 1 });
      pintarNumeracao();
      ui.toast('Numeração definida.', 'ok');
    }
    if (tipo === 'senha') {
      const s1 = val('s1'), s2 = val('s2');
      if (s1.length < 4) { ui.toast('Use pelo menos 4 caracteres.', 'erro'); return; }
      if (s1 !== s2) { ui.toast('As senhas não coincidem.', 'erro'); return; }
      await RIF.app.salvarConfig('senhaHash', u.hash(s1));
      f.reset();
      ui.toast('Senha alterada.', 'ok');
    }
  });

  return { render: render };
})();

/* ==========================================================
   JIS B 2220:2012 — Steel pipe flanges (flanges de aço)
   Classes 5K, 10K, 10K leve (L), 16K, 20K, 30K, 40K e 63K;
   tamanhos 10A a 1500A — valores em mm

   Fonte: tradução oficial em inglês (JSA, 2013) enviada pela
   Qualidade. O PDF é digitalizado com uma camada de texto
   (OCR). Cada número das Tabelas 13 a 21 foi conferido com um
   segundo OCR feito na imagem de 400 dpi, célula por célula
   (4 271 células; as poucas divergências foram vistas na
   imagem e eram erro do segundo OCR). Os campos com traço
   também foram conferidos.
   Conferência cruzada: Ø do cubo do WN (a) = Ø externo do tubo
   (Anexo B) em todas as classes; ressalto g/f das tabelas de
   cada classe = Tabela 13; 16K e 20K com a mesma furação;
   furos d0 iguais entre as classes; MF × TG coerentes.

   - Tipos: SOP, SOH (20K e 30K: tipos A, B e C), SW, WN
     (e WN com as dimensões alternativas H), LJ, TR e BL.
     O flange integral (IT) ficou de fora (é parte de válvula ou
     conexão; as medidas dele na norma são informativas).
   - Faces conforme a Tabela 8 (combinações que a norma não
     admite não aparecem): FF, RF, MF (macho/fêmea) e TG
     (lingueta/ranhura). LJ não tem face de vedação.
   - Face RF: t inclui o ressalto; a espessura conferida é
     t − f (Tabela 22). A altura f não tem tolerância na norma.
   - MF e TG: Tabela 13; na 10K valem os valores entre
     parênteses (150A e 300A) e a fêmea/ranhura não tem o anel
     externo g (nota b).
   - Ø interno d (SW, WN e SOH tipo C): vem preenchido com o
     valor da tabela, mas deve ser ajustado ao Ø interno do tubo
     (nota a das tabelas) — o inspetor pode trocar.
   - Tolerâncias: Tabela 22. Sem tolerância na norma (o
     inspetor avalia): altura do ressalto f, Ø maior do cubo b,
     profundidade do encaixe S e batente l. Não incluídos: raio r
     e conicidade x do cubo.
   - Ficaram de fora: ressalto pequeno (Anexo C), classe 2K
     (Anexo E) e flanges com solda de topo por centelhamento
     (Anexo A).
   ========================================================== */

/* ==========================================================
   RIF — aplicativo: inicialização, configurações e rotas
   ========================================================== */
RIF.app = (function () {
  const u = RIF.u, ui = RIF.ui;

  const CHECKLIST_PADRAO = [
    'Marcação conforme (fabricante, norma, classe, tamanho, material e corrida)',
    'Acabamento da face de vedação ranhurado (Ra 3,2 a 6,3 µm)',
    'Face de vedação sem riscos radiais ou imperfeições acima do permitido',
    'Furação equidistante e fora das linhas de centro',
    'Sem trincas, dobras, porosidades ou rebarbas',
    'Chanfro de solda conforme (Welding Neck)',
    'Rosca conforme e protegida (Roscado)',
    'Proteção anticorrosiva / pintura',
    'Identificação e embalagem'
  ];

  const PADROES = {
    empresa: { nome: 'Aços Vital', sigla: 'AV', logo: null, codigoFormulario: '' },
    pecasPadrao: 3,
    instrumentos: [],
    inspetores: [],
    checklist: CHECKLIST_PADRAO.map(t => ({ id: u.uid(), texto: t })),
    produtos: [],
    senhaHash: u.hash('140807')
  };

  const estado = {
    cfg: {},
    validacoes: {},
    cfgLiberado: false,
    saida: null // função chamada ao sair da tela atual
  };

  async function carregarConfig() {
    for (const k of Object.keys(PADROES)) {
      let v = await RIF.db.config.obter(k, null);
      if (v === null) { v = u.clonar(PADROES[k]); await RIF.db.config.salvar(k, v); }
      estado.cfg[k] = v;
    }
    estado.validacoes = await RIF.db.validacoes.listar();
    atualizarMarca();
  }

  async function salvarConfig(chave, valor) {
    estado.cfg[chave] = valor;
    await RIF.db.config.salvar(chave, valor);
    if (chave === 'empresa') atualizarMarca();
  }

  function ctxRelatorio() { return { empresa: estado.cfg.empresa }; }

  /* ---------- topo ---------- */
  function atualizarMarca() {
    const emp = estado.cfg.empresa || PADROES.empresa;
    const logo = document.getElementById('marca-logo');
    if (logo) logo.innerHTML = emp.logo ? '<img src="' + emp.logo + '" alt="">' : u.esc((emp.sigla || 'AV').slice(0, 3));
    const nome = document.getElementById('marca-nome');
    if (nome) nome.textContent = 'Inspeção Final · ' + (emp.nome || '');
  }

  async function atualizarBadge() {
    const lista = await RIF.db.relatorios.listar();
    const n = lista.filter(r => r.status !== 'finalizado').length;
    const b = document.getElementById('badge-rascunhos');
    if (b) { b.textContent = n; b.hidden = n === 0; }
  }

  /* ---------- rotas ---------- */
  async function navegar() {
    if (estado.saida) { try { await estado.saida(); } catch (e) { console.error(e); } estado.saida = null; }
    const partes = (location.hash.replace(/^#\/?/, '') || 'relatorios').split('/');
    // troca o contêiner da tela para descartar os eventos da tela anterior
    const antigo = document.getElementById('view');
    const main = antigo.cloneNode(false);
    antigo.replaceWith(main);
    document.body.classList.remove('tela-detalhe');
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('ativo', a.dataset.rota === partes[0]));
    window.scrollTo(0, 0);
    try {
      if (partes[0] === 'novo') {
        const rel = await novoRelatorio();
        location.replace('#/rif/' + rel.id);
        return;
      }
      if (partes[0] === 'rif' && partes[1]) {
        document.body.classList.add('tela-detalhe');
        document.querySelector('.nav a[data-rota="relatorios"]').classList.add('ativo');
        const rel = await RIF.db.relatorios.obter(partes[1]);
        if (!rel) { main.innerHTML = '<div class="vazio">' + ui.icon('alerta') + '<h3>Relatório não encontrado</h3><a class="btn btn-pri" href="#/relatorios">Ver relatórios</a></div>'; return; }
        estado.saida = rel.status === 'finalizado' ? RIF.vRelatorio.render(main, rel) : RIF.vEditor.render(main, rel);
        return;
      }
      if (partes[0] === 'config') { estado.saida = RIF.vConfig.render(main); return; }
      if (RIF.embed) { RIF.host.evento('lista'); return; }
      estado.saida = RIF.vHistorico.render(main);
    } finally {
      atualizarBadge();
    }
  }

  /** Cria um rascunho novo com os padrões atuais. */
  async function novoRelatorio(base) {
    const cfg = estado.cfg;
    const rel = {
      id: u.uid(),
      status: 'rascunho',
      numero: null,
      criadoEm: new Date().toISOString(),
      dataInspecao: u.hojeISO(),
      produto: { modo: 'norma', normaId: (RIF.normas.todas()[0] || {}).id || null, sel: {}, descricao: '' },
      ident: { cliente: '', material: '', quantidade: '', pv: '', vendedor: '', lote: '', corrida: '', desenho: '', sinete: '' },
      pecas: cfg.pecasPadrao || 3,
      cotas: [],
      visual: (cfg.checklist || []).map(i => ({ id: i.id, texto: i.texto, resp: null })),
      instrumentos: [],
      fotos: [],
      resultado: null,
      observacoes: '',
      inspetor: '',
      assinatura: null
    };
    if (base) {
      rel.produto = u.clonar(base.produto);
      delete rel.produto.validacao;
      rel.ident = u.clonar(base.ident);
      rel.pecas = base.pecas;
      rel.cotas = (base.cotas || []).map(c => Object.assign(u.clonar(c), {
        id: u.uid(), medidas: new Array(base.pecas).fill(''), sitManual: c.sitManual === 'na' ? 'na' : null
      }));
      rel.instrumentos = u.clonar(base.instrumentos || []);
      rel.inspetor = base.inspetor || '';
      // itens visuais específicos da norma do relatório de origem
      rel.visual = rel.visual.concat((base.visual || []).filter(v => v.origem === 'norma')
        .map(v => ({ id: u.uid(), texto: v.texto, resp: null, origem: 'norma' })));
    }
    await RIF.db.relatorios.salvar(rel);
    return rel;
  }

  async function iniciar() {
    // data no topo
    const d = document.getElementById('topo-data');
    if (d) d.textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
    const modo = document.getElementById('selo-modo');
    if (modo) { modo.innerHTML = ui.icon(RIF.db.modo === 'local' ? 'aparelho' : 'nuvem') + '<span>' + (RIF.db.modo === 'local' ? 'Local' : 'Nuvem') + '</span>'; modo.title = RIF.db.descricaoModo; }
    document.getElementById('topo-voltar').onclick = () => { location.hash = '#/relatorios'; };
    try {
      await RIF.db.init();
      await carregarConfig();
      if (RIF.embed) estado.cfgLiberado = true;
    } catch (e) {
      console.error(e);
      document.getElementById('view').innerHTML = '<div class="vazio">' + ui.icon('alerta') + '<h3>Não foi possível abrir o armazenamento</h3><p>' + u.esc(e.message) + '</p></div>';
      return;
    }
    window.addEventListener('hashchange', navegar);
    navegar();
    if (!RIF.embed) registrarServiceWorker();
  }

  function registrarServiceWorker() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (!reg) return;
      reg.addEventListener('updatefound', () => {
        const novo = reg.installing;
        if (!novo) return;
        novo.addEventListener('statechange', () => {
          if (novo.state === 'installed' && navigator.serviceWorker.controller) {
            ui.toast('Nova versão do app disponível.', 'info', 15000, { rotulo: 'Atualizar', fn: () => location.reload() });
          }
        });
      });
    }).catch(e => console.warn('Service worker:', e));
  }

  /** Carrega os arquivos de norma listados em normas/catalogo.js e inicia o app. */
  function carregarNormasEIniciar() {
    const lista = window.RIF_CATALOGO_NORMAS || [];
    let i = 0;
    (function proxima() {
      if (i >= lista.length) { iniciar(); return; }
      const s = document.createElement('script');
      s.src = 'normas/' + lista[i++];
      s.onload = proxima;
      s.onerror = () => { console.error('Norma não carregada: ' + s.src); proxima(); };
      document.head.appendChild(s);
    })();
  }

  /** Vai para uma rota; se já estiver nela, redesenha a tela. */
  function ir(hash) {
    if (location.hash === hash) navegar(); else location.hash = hash;
  }

  return {
    estado, carregarConfig, salvarConfig, ctxRelatorio, novoRelatorio, atualizarBadge,
    carregarNormasEIniciar, ir, PADROES, CHECKLIST_PADRAO
  };
})();

window.RIF_CATALOGO_NORMAS = [];
RIF.app.carregarNormasEIniciar();

</script>
