    olho: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    aparelho: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    visual: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/>',
    imagem: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 8"/>',
    usuario: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
    caixa: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    resultado: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 10"/>',
    lista: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
    editar: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    cima: '<path d="M6 15l6-6 6 6"/>',
    baixo: '<path d="M6 9l6 6 6-6"/>',
    nuvem: '<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/>',
    livro: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
    mais: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
    bandeira: '<path d="M5 21V4h11l-1.5 4L16 12H5"/>'
  };

  function icon(nome, cls) {
    return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (P[nome] || '') + '</svg>';
  }

  /* ---------- avisos rápidos ---------- */
  function toast(msg, tipo, ms, acao) {
    let box = document.getElementById('toasts');
    if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
    while (box.children.length >= 2) box.firstChild.remove(); // no máximo 2 avisos na tela
    const el = document.createElement('div');
    el.className = 'toast toast-' + (tipo || 'info');
    el.setAttribute('role', 'status');
    el.innerHTML = '<span>' + RIF.u.esc(msg) + '</span>' + (acao ? '<button type="button">' + RIF.u.esc(acao.rotulo) + '</button>' : '');
    if (acao) el.querySelector('button').onclick = () => { acao.fn(); fechar(); };
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('on'));
    function fechar() { el.classList.remove('on'); setTimeout(() => el.remove(), 250); }
    setTimeout(fechar, ms || (acao ? 8000 : 3200));
  }

  /* ---------- janela modal ---------- */
  function modal(o) {
    return new Promise(resolve => {
      const fundo = document.createElement('div');
      fundo.className = 'modal-fundo';
      const botoes = (o.botoes || []).map((b, i) =>
        '<button type="button" class="btn ' + (b.classe || 'btn-sec') + '" data-i="' + i + '">' + (b.icone ? icon(b.icone) : '') + RIF.u.esc(b.rotulo) + '</button>').join('');
      fundo.innerHTML =
        '<div class="modal ' + (o.largo ? 'modal-largo' : '') + '" role="dialog" aria-modal="true" aria-label="' + RIF.u.esc(o.titulo || '') + '">' +
          '<div class="modal-cab"><h2>' + RIF.u.esc(o.titulo || '') + '</h2>' +
          '<button type="button" class="btn-icone" data-fechar aria-label="Fechar">' + icon('x') + '</button></div>' +
          '<div class="modal-corpo">' + (o.html || '') + '</div>' +
          (botoes ? '<div class="modal-rodape">' + botoes + '</div>' : '') +
        '</div>';
      document.body.appendChild(fundo);
      document.body.classList.add('com-modal');
      const caixa = fundo.querySelector('.modal');
      let fechado = false;
      function fechar(valor) {
        if (fechado) return;
        fechado = true;
        document.removeEventListener('keydown', tecla);
        fundo.classList.remove('on');
        setTimeout(() => {
          fundo.remove();
          if (!document.querySelector('.modal-fundo')) document.body.classList.remove('com-modal');
        }, 180);
        resolve(valor === undefined ? null : valor);
      }
      function tecla(e) { if (e.key === 'Escape') fechar(null); }
      document.addEventListener('keydown', tecla);
      fundo.addEventListener('mousedown', e => { if (e.target === fundo && !o.bloqueante) fechar(null); });
      fundo.querySelector('[data-fechar]').onclick = () => fechar(null);
      fundo.querySelectorAll('.modal-rodape [data-i]').forEach(btn => {
        btn.onclick = async () => {
          const b = o.botoes[+btn.dataset.i];
          if (b.acao) {
            const r = await b.acao(caixa);
            if (r === false) return; // ação pediu para manter aberto
            fechar(r === undefined ? b.valor : r);
          } else fechar(b.valor);
        };
      });
      requestAnimationFrame(() => {
        fundo.classList.add('on');
        const foco = caixa.querySelector('[autofocus], .modal-corpo input, .modal-corpo select, .modal-corpo textarea');
        if (foco) foco.focus();
      });
      if (o.aoAbrir) o.aoAbrir(caixa, fechar);
    });
  }

  function confirmar(msg, o) {
    o = o || {};
    return modal({
      titulo: o.titulo || 'Confirmar',
      html: o.html || '<p class="modal-texto">' + RIF.u.esc(msg).replace(/\n/g, '<br>') + '</p>',
      botoes: [
        { rotulo: o.cancelar || 'Cancelar', classe: 'btn-sec', valor: false },
        { rotulo: o.ok || 'Confirmar', classe: o.perigo ? 'btn-perigo' : 'btn-pri', valor: true }
      ]
    }).then(v => v === true);
  }

  function alerta(msg, titulo) {
    return modal({
      titulo: titulo || 'Atenção',
      html: '<p class="modal-texto">' + RIF.u.esc(msg).replace(/\n/g, '<br>') + '</p>',
      botoes: [{ rotulo: 'OK', classe: 'btn-pri', valor: true }]
    });
  }

  return { icon, toast, modal, confirmar, alerta };
})();

/* ==========================================================
   RIF dentro da Central da Qualidade
   Substitui o db.js (armazenamento no aparelho) por uma ponte
   com a Central (window.parent.CQ_RIF_HOST), que grava no banco
   da Qualidade. A mesma interface: relatorios / config /
   validacoes / backup.
   ========================================================== */
window.RIF = window.RIF || {};
RIF.host = (function () {
  try { if (window.self !== window.top && window.parent.CQ_RIF_HOST) return window.parent.CQ_RIF_HOST; } catch (e) { /* Central fechada */ }
  return null;
})();
RIF.embed = !!RIF.host;
RIF.hostMe = function () { return RIF.host ? (RIF.host.me().nome || '') : ''; };
(function () {
  if (!RIF.embed) return;
  const me = RIF.host.me();
  document.documentElement.classList.add('rif-embed');
  if (!me.admin) document.documentElement.classList.add('rif-insp');
})();

RIF.db = (function () {
  if (!RIF.host) {
    return {
      modo: 'local', descricaoModo: 'Abra pela Central da Qualidade',
      init: () => Promise.reject(new Error('Este relatório só funciona dentro da Central da Qualidade.')),
      relatorios: {}, config: {}, validacoes: {}, backup: {}
    };
  }
  const H = RIF.host;
  const agora = () => new Date().toISOString();
  const nada = () => Promise.reject(new Error('Na Central, use o backup da própria Central (Configurações › Backup).'));
  return {
    modo: 'nuvem',
    descricaoModo: 'Dados na Central da Qualidade',
    init: () => Promise.resolve(),
    relatorios: {
      listar: () => Promise.resolve([]),
      obter: (id) => H.relGet(id),
      salvar: (rel) => { rel.atualizadoEm = agora(); return H.relSave(rel).then(() => rel); },
      excluir: (id) => H.relDel(id),
      finalizar: (rel) => H.relFin(rel)
    },
    config: {
      obter: (chave, padrao) => Promise.resolve(H.cfgGet(chave)).then((v) => (v === null || v === undefined ? (padrao === undefined ? null : padrao) : v)),
      salvar: (chave, valor) => Promise.resolve(H.cfgSet(chave, valor))
    },
    validacoes: {
      listar: () => Promise.resolve(H.valList()),
      salvar: (chave, info) => Promise.resolve(H.valSave(chave, info)),
      remover: (chave) => Promise.resolve(H.valDel(chave))
    },
    backup: { exportar: nada, importar: nada }
  };
})();

/* ==========================================================
   RIF — motor de normas
   Cada norma é um arquivo em /normas que chama
   RIF.normas.registrar({...}). Formato (resumo):

   id, sigla, edicao, nomeCompleto, titulo, produto, unidade
                  (nomeCompleto: opcional, ex.: "DIN EN 1092-1:2008"; senão sigla-edicao)
   descricao      modelo do texto do produto. Ex.: "FLANGE {tipo} {nps}\" CLASSE {classe}"
   seletores      [{id, rotulo, formato, opcoes}] — ex.: tipo → classe → nps → face
                  "opcoes" = lista fixa (ex.: RF / RTJ), sem vir dos dados
   chaveDados     ordem de aninhamento de "dados" (ex.: ["classe","nps"])
   seletorTamanho seletor usado nas faixas de tolerância (ex.: "nps")
   tipos          {COD: {nome, cotas:[{cod, col, opcional, editavel, desc,
                                       criterio, tol, se:{seletor: valor(es)}}],
                         proibido:[{seletor: valor(es)}], descricao}}
                  (sem tipos: use "cotas" direto na norma)
                  proibido = combinações que a norma não admite para o tipo (ex.: face RF
                  na classe 10K); a regra vale quando todos os seletores dela batem.
                  descricao = modelo próprio do texto do produto para o tipo.
   colunas        {col: {desc, criterio: "nominal"|"min"|"max"|"exato",
                         tol: [{de, ate, se, nomAte, nomDe, campo:{col,de,ate}, sup, inf, pct, ref}],
                         tolCampo, tolRef}}
                  (campo = condição sobre outra coluna do registro, ex.: parafuso M27 a M45)
                  (tolCampo = coluna do registro com a tolerância [sup, inf] daquela linha da tabela,
                   quando a norma dá a tolerância junto de cada valor; tolRef = referência mostrada)
   inspecaoVisual [{texto, tipos, se, de, ate}] — itens extras da inspeção visual
                  (filtros opcionais: tipos, seletores e faixa de tamanho)
   dados          {classe: {nps: {col: valor, _nota, _nota_<tipo>}}}
   ========================================================== */
RIF.normas = (function () {
  const mapa = {};
  const ordem = [];

  function registrar(def) {
    if (!def || !def.id || !def.dados) { console.error('Norma inválida', def); return; }
    def.seletores = def.seletores || [];
    def.chaveDados = def.chaveDados || def.seletores.filter(s => s.id !== 'tipo' && !s.opcoes).map(s => s.id);
    def.colunas = def.colunas || {};
    if (!mapa[def.id]) ordem.push(def.id);
    mapa[def.id] = def;
  }

  function todas() { return ordem.map(id => mapa[id]); }
  function obter(id) { return mapa[id] || null; }
  function nome(n) { return n ? (n.nomeCompleto || n.sigla + (n.edicao ? '-' + n.edicao : '')) : ''; }
  function vazio(v) { return v === null || v === undefined || v === ''; }

  function formatar(s, v) {
    if (s && s.opcoes) {
      const o = s.opcoes.find(x => String(x.valor) === String(v));
      if (o && o.curto) return o.curto;
    }
    return s && s.formato ? s.formato.replace('{v}', v) : String(v);
  }

  function cotasDoTipo(n, tipo) {
    if (n.tipos) return tipo && n.tipos[tipo] ? n.tipos[tipo].cotas : null;
    return n.cotas || [];
  }

  /** A cota vale para a seleção? true / false / null (ainda indefinido). */
  function cotaAplica(c, sel) {
    if (!c.se) return true;
    for (const k of Object.keys(c.se)) {
      const v = sel[k];
      if (vazio(v)) return null;
      if ([].concat(c.se[k]).map(String).indexOf(String(v)) < 0) return false;
    }
    return true;
  }

  function registro(n, sel) {
    let no = n.dados;
    for (const k of n.chaveDados) {
      if (!no || vazio(sel[k])) return null;
      no = no[sel[k]];
    }
    return no || null;
  }

  /** Registro tem todas as cotas obrigatórias que valem para a seleção?
      Opções fixas podem exigir uma coluna nos dados (ex.: face RTJ exige o canal do anel). */
  /** A seleção cai numa combinação que a norma não admite (regras "proibido" do tipo ou da norma)? */
  function proibida(n, sel) {
    const t = n.tipos && sel && sel.tipo ? n.tipos[sel.tipo] : null;
    const regras = ((t && t.proibido) || []).concat(n.proibido || []);
    return regras.some(r => Object.keys(r).every(k =>
      !vazio(sel[k]) && [].concat(r[k]).map(String).indexOf(String(sel[k])) >= 0));
  }

  function completo(n, reg, cotas, sel) {
    if (!reg || !cotas) return false;
    if (proibida(n, sel)) return false;
    for (const s of n.seletores) {
      if (!s.opcoes || vazio(sel[s.id])) continue;
      const op = s.opcoes.find(o => String(o.valor) === String(sel[s.id]));
      if (op && op.requer && vazio(reg[op.requer])) return false;
    }
    return cotas.every(c => cotaAplica(c, sel) !== true || c.opcional || !vazio(reg[c.col]));
  }

  /** Existe ao menos uma combinação completa compatível com a seleção parcial? */
  function existeCompleto(n, sel) {
    const tipos = n.tipos ? (sel.tipo ? [sel.tipo] : Object.keys(n.tipos)) : [null];
    return tipos.some(t => {
      const cot = cotasDoTipo(n, t);
      if (!cot) return false;
      const s2 = t ? Object.assign({}, sel, { tipo: t }) : sel;
      return (function andar(no, i, s) {
        if (!no) return false;
        if (i >= n.chaveDados.length) return completo(n, no, cot, s);
        const k = n.chaveDados[i];
        if (!vazio(s[k])) return andar(no[s[k]], i + 1, s);
        return Object.keys(no).some(x => { const s3 = Object.assign({}, s); s3[k] = x; return andar(no[x], i + 1, s3); });
      })(n.dados, 0, s2);
    });
  }

  function candidatos(n, s, sel) {
    if (s.opcoes) return s.opcoes.map(o => ({ valor: String(o.valor), rotulo: o.rotulo || String(o.valor) }));
    const nivel = n.chaveDados.indexOf(s.id);
    if (s.id === 'tipo' && n.tipos && nivel < 0) {
      // chaves como "01", "05", "11": o JS põe as numéricas primeiro; ordena pelo valor
      return RIF.u.ordenarValores(Object.keys(n.tipos)).map(k => ({ valor: k, rotulo: n.tipos[k].nome || k }));
    }
    if (nivel < 0) return [];
    const chaves = [];
    (function andar(no, i) {
      if (!no) return;
      if (i === nivel) { Object.keys(no).forEach(k => { if (chaves.indexOf(k) < 0) chaves.push(k); }); return; }
      const k = n.chaveDados[i];
      if (!vazio(sel[k])) andar(no[sel[k]], i + 1);
      else Object.keys(no).forEach(x => andar(no[x], i + 1));
    })(n.dados, 0);
    return RIF.u.ordenarValores(chaves).map(k => ({
      valor: k, rotulo: s.id === 'tipo' && n.tipos && n.tipos[k] ? n.tipos[k].nome : formatar(s, k)
    }));
  }

  /** Opções do seletor de índice idx, considerando o que já foi escolhido antes dele. */
  function opcoes(n, idx, sel) {
    const s = n.seletores[idx];
    if (!s) return [];
    const antes = {};
    n.seletores.slice(0, idx).forEach(x => { if (!vazio(sel[x.id])) antes[x.id] = sel[x.id]; });
    return candidatos(n, s, antes).filter(o => {
      const teste = Object.assign({}, antes);
      teste[s.id] = o.valor;
      return existeCompleto(n, teste);
    });
  }

  function selecaoCompleta(n, sel) {
    return !!n && n.seletores.every(s => sel && !vazio(sel[s.id]));
  }

  /** A regra de tolerância vale? (faixa de tamanho, seletores e/ou valor nominal) */
  function regraVale(r, tam, sel, nominal, reg) {
    if (!vazio(r.de) && !(tam >= r.de - 1e-9)) return false;
    if (!vazio(r.ate) && !(tam <= r.ate + 1e-9)) return false;
    if (!vazio(r.nomDe) && !(nominal >= r.nomDe - 1e-9)) return false;
    if (!vazio(r.nomAte) && !(nominal <= r.nomAte + 1e-9)) return false;
    if (r.campo) {   // condição sobre outra coluna do registro (ex.: tamanho do parafuso)
      const x = reg ? RIF.u.num(reg[r.campo.col]) : NaN;
      if (isNaN(x)) return false;
      if (!vazio(r.campo.de) && !(x >= r.campo.de - 1e-9)) return false;
      if (!vazio(r.campo.ate) && !(x <= r.campo.ate + 1e-9)) return false;
    }
    if (r.se) {
      for (const k of Object.keys(r.se)) {
        if ([].concat(r.se[k]).map(String).indexOf(String(sel[k])) < 0) return false;
      }
    }
    return true;
  }

  /** Lista de cotas a inspecionar (com nominal e tolerância) para a combinação escolhida. */
  function cotas(n, sel) {
    const reg = registro(n, sel);
    const lista = cotasDoTipo(n, sel.tipo);
    if (!reg || !lista) return [];
    const tam = RIF.u.valorTamanho(sel[n.seletorTamanho]);
    return lista.filter(c => cotaAplica(c, sel) === true).map(c => {
      const col = n.colunas[c.col] || {};
      const v = reg[c.col];
      if (vazio(v) && !c.editavel) return null;
      const regras = c.tol || col.tol || [];
      const tc = c.tolCampo || col.tolCampo;          // tolerância impressa na própria linha da tabela
      const regra = tc && Array.isArray(reg[tc])
        ? { sup: reg[tc][0], inf: reg[tc][1], ref: c.tolRef || col.tolRef || '' }
        : regras.find(r => regraVale(r, tam, sel, vazio(v) ? NaN : +v, reg));
      let nota = c.nota || col.nota || '';
      const notaDe = c.notaDe || col.notaDe;
      const notaReg = notaDe && !vazio(reg[notaDe]) ? (c.notaFormato || col.notaFormato || '{v}').replace('{v}', reg[notaDe]) : '';
      if (notaReg) nota = notaReg;
      if (vazio(v) && c.editavel) nota = 'Especificado pelo comprador: digite o valor do pedido.' + (notaReg ? ' ' + notaReg : '');
      return {
        id: RIF.u.uid(),
        cod: c.cod,
        desc: c.desc || col.desc || c.cod,
        nominal: vazio(v) ? null : v,
        criterio: c.criterio || col.criterio || 'nominal',
        tolSup: regra && regra.sup !== undefined ? regra.sup : null,
        tolInf: regra && regra.inf !== undefined ? regra.inf : null,
        tolPct: regra && regra.pct !== undefined ? regra.pct : null,
        refTol: regra && regra.ref ? regra.ref : '',
        editavel: !!c.editavel,
        nota: nota,
        origem: 'norma',
        col: c.col,
        medidas: [],
        sitManual: null
      };
    }).filter(Boolean);
  }

  /** Observação da própria tabela para a combinação (ex.: "usar dimensões da classe 600"). */
  function notaRegistro(n, sel) {
    const reg = registro(n, sel);
    if (!reg) return '';
    // _nota vale para todos os tipos; _nota_<tipo> só para o tipo escolhido (ex.: _nota_13)
    return [reg._nota, sel && sel.tipo ? reg['_nota_' + sel.tipo] : ''].filter(Boolean).join(' ');
  }

  /** Itens extras de inspeção visual definidos pela norma para o tipo escolhido. */
  function itensVisuais(n, sel) {
    const tam = RIF.u.valorTamanho(sel[n.seletorTamanho]);
    return (n.inspecaoVisual || []).filter(i =>
      (!i.tipos || i.tipos.indexOf(sel.tipo) >= 0) &&
      (!i.se || cotaAplica(i, sel) === true) &&
      (vazio(i.de) || tam >= i.de - 1e-9) &&
      (vazio(i.ate) || tam <= i.ate + 1e-9)
    ).map(i => i.texto);
  }

  function descricao(n, sel) {
    const tp = n.tipos && sel && sel.tipo ? n.tipos[sel.tipo] : null;
    let t = (tp && tp.descricao) || n.descricao || (n.produto + ' ' + rotuloSelecao(n, sel) + ' — ' + nome(n));
    n.seletores.forEach(s => { t = t.split('{' + s.id + '}').join(sel[s.id] || ''); });
    return RIF.u.maiusc(t.replace(/\s+/g, ' ').trim());
  }

  function rotuloSelecao(n, sel) {
    return n.seletores.map(s => s.id === 'tipo' ? sel.tipo : formatar(s, sel[s.id])).join(' · ');
  }

  /** Chave única da combinação (usada nas validações da Qualidade). */
  function chave(n, sel) {
    return [n.id].concat(n.seletores.map(s => sel[s.id])).join('|');
  }

  /** Norma e seleção a partir da chave da combinação ("ID|v1|v2|..."). */
  function selecaoDaChave(ch) {
    const partes = String(ch).split('|');
    const n = obter(partes[0]);
    if (!n) return null;
    const sel = {};
    n.seletores.forEach((s, i) => { sel[s.id] = partes[i + 1]; });
    return { norma: n, sel: sel };
  }

  function rotuloChave(ch) {
    const x = selecaoDaChave(ch);
    return x ? nome(x.norma) + ' — ' + rotuloSelecao(x.norma, x.sel) : ch;
  }

  /* ---------- correções da Qualidade (gravadas na validação da combinação) ----------
     validação = { responsavel, data, motivo, correcoes: { <coluna>: { nominal, tolSup, tolInf } } }
     A correção substitui o nominal e a tolerância da cota em todos os relatórios novos. */
  function chaveCota(c) { return c.col || c.cod; }

  /** Tolerância em mm (a percentual vira valor absoluto). */
  function tolEfetiva(c) {
    if (!vazio(c.tolPct) && !vazio(c.nominal)) {
      const t = Math.round(Math.abs(+c.nominal) * c.tolPct / 100 * 1000) / 1000;
      return { sup: t, inf: t };
    }
    return { sup: vazio(c.tolSup) ? null : +c.tolSup, inf: vazio(c.tolInf) ? null : +c.tolInf };
  }

  /** Texto curto com o valor da cota, ex.: "482,6 ± 3,2". */
  function textoValorCota(c) {
    const nom = vazio(c.nominal) ? 'pelo pedido' : RIF.u.fmt(+c.nominal);
    const tol = RIF.aval ? RIF.aval.textoTol(c) : '';
    if (c.criterio === 'exato') return nom + ' (exato)';
    return nom + (tol && tol !== '—' ? ' ' + tol : ' (sem tolerância)') + (c.criterio === 'min' ? ' mín.' : c.criterio === 'max' ? ' máx.' : '');
  }

  function mesmoNumero(a, b) {
    const x = vazio(a) ? null : +a, y = vazio(b) ? null : +b;
    return x === null || y === null ? x === y : Math.abs(x - y) < 1e-9;
  }

  /** A correção muda algo em relação ao valor da norma? */
  function correcaoMuda(c, x) {
    if (!x) return false;
    const t = tolEfetiva(c);
    return !mesmoNumero(x.nominal, c.nominal) || (c.criterio !== 'exato' && (!mesmoNumero(x.tolSup, t.sup) || !mesmoNumero(x.tolInf, t.inf)));
  }

  /** Aplica às cotas geradas da norma as correções da validação (val). Altera e devolve a lista. */
  function aplicarCorrecoes(lista, val) {
    const corr = val && val.correcoes;
    if (!corr) return lista;
    lista.forEach(c => {
      const x = corr[chaveCota(c)];
      if (!correcaoMuda(c, x)) return;   // sem correção, ou o arquivo da norma já traz o valor certo
      const norma = { nominal: c.nominal, tolSup: c.tolSup, tolInf: c.tolInf, tolPct: c.tolPct, refTol: c.refTol, texto: textoValorCota(c) };
      c.nominal = vazio(x.nominal) ? null : +x.nominal;
      if (c.criterio !== 'exato') {
        c.tolSup = vazio(x.tolSup) ? null : +x.tolSup;
        c.tolInf = vazio(x.tolInf) ? null : +x.tolInf;
        c.tolPct = null;
        c.refTol = 'Qualidade';
      }
      c.corrigida = { norma: norma, responsavel: val.responsavel || '', data: val.data || '', motivo: val.motivo || '' };
      c.nota = 'Corrigido pela Qualidade — na norma: ' + norma.texto + '.' + (c.nota ? ' ' + c.nota : '');
    });
    return lista;
  }

  /** Quantas cotas a validação corrige de fato. */
  function contarCorrecoes(val) {
    return val && val.correcoes ? Object.keys(val.correcoes).length : 0;
  }

  /** Quantas combinações completas a norma tem (para a tela de configurações). */
  function contarCombinacoes(n) {
    let total = 0;
    const fixos = n.seletores.filter(s => s.opcoes);
    const tipos = n.tipos ? Object.keys(n.tipos) : [null];
    tipos.forEach(t => {
      const cot = cotasDoTipo(n, t);
      (function andar(no, i, caminho) {
        if (!no) return;
        if (i >= n.chaveDados.length) {
          (function combinar(k, sel) {
            if (k >= fixos.length) { if (completo(n, no, cot, sel)) total++; return; }
            fixos[k].opcoes.forEach(o => { const s2 = Object.assign({}, sel); s2[fixos[k].id] = String(o.valor); combinar(k + 1, s2); });
          })(0, Object.assign(t ? { tipo: t } : {}, caminho));
          return;
        }
        Object.keys(no).forEach(k => { const c2 = Object.assign({}, caminho); c2[n.chaveDados[i]] = k; andar(no[k], i + 1, c2); });
      })(n.dados, 0, {});
    });
    return total;
  }

  return {
    registrar, todas, obter, nome, opcoes, selecaoCompleta, cotas, notaRegistro, itensVisuais,
    descricao, rotuloSelecao, chave, rotuloChave, selecaoDaChave, contarCombinacoes, formatar,
    chaveCota, tolEfetiva, textoValorCota, correcaoMuda, aplicarCorrecoes, contarCorrecoes
  };
})();

/* ==========================================================
   RIF — avaliação das medidas (tolerância automática)
   critério "nominal": nominal −inf … nominal +sup  (sem tolerância → inspetor avalia)
   critério "min":     valor ≥ nominal (e ≤ nominal + sup, se houver)
   critério "max":     valor ≤ nominal (e ≥ nominal − inf, se houver)
   ========================================================== */
RIF.aval = (function () {
  const EPS = 1e-6;
  const u = RIF.u;
  const temValor = v => v !== null && v !== undefined && v !== '' && !isNaN(v);

  /** Limites de aceitação da cota, ou null quando a avaliação é manual. */
  function limites(c) {
    const nom = u.num(c.nominal);
    if (isNaN(nom)) return null;
    let sup = temValor(c.tolSup) ? +c.tolSup : null;
    let inf = temValor(c.tolInf) ? +c.tolInf : null;
    if (temValor(c.tolPct)) { sup = inf = Math.abs(nom) * c.tolPct / 100; } // tolerância em % do nominal
    if (c.criterio === 'exato') return { min: nom, max: nom };
    if (c.criterio === 'min') return { min: nom - (inf || 0), max: sup !== null ? nom + sup : Infinity };
    if (c.criterio === 'max') return { min: inf !== null ? nom - inf : -Infinity, max: nom + (sup || 0) };
    if (sup === null && inf === null) return null;
    return { min: nom - (inf || 0), max: nom + (sup || 0) };
  }

  /** Situação de uma medida: vazio | ok | nc | livre (sem limite) */
  function medida(c, texto) {
    const v = u.num(texto);
    if (isNaN(v)) return 'vazio';
    const lim = limites(c);
    if (!lim) return 'livre';
    return (v < lim.min - EPS || v > lim.max + EPS) ? 'nc' : 'ok';
  }

  /** Situação da cota: ok | nc | parcial | pendente | avaliar | na */
  function cota(c) {
    if (c.sitManual === 'na') return 'na';
    const meds = c.medidas || [];
    const lim = limites(c);
    const preench = meds.filter(m => !isNaN(u.num(m)));
    if (!lim) {
      if (c.sitManual === 'ok') return 'ok';
      if (c.sitManual === 'nc') return 'nc';
      return preench.length ? 'avaliar' : 'pendente';
    }
    if (preench.some(m => medida(c, m) === 'nc')) return 'nc';
    if (!preench.length) return 'pendente';
    if (preench.length < meds.length) return 'parcial';
    return 'ok';
  }

  /** Texto da tolerância para exibir. */
  function textoTol(c) {
    const sup = temValor(c.tolSup) ? +c.tolSup : null;
    const inf = temValor(c.tolInf) ? +c.tolInf : null;
    if (c.criterio === 'exato') return 'exato';
    if (temValor(c.tolPct)) return '± ' + u.fmt(+c.tolPct) + ' %';
    if (c.criterio === 'min' && sup === null && !inf) return 'mínimo';
    if (c.criterio === 'max' && inf === null && !sup) return 'máximo';
    if (sup === null && inf === null) return '—';
    const cs = Math.max(1, casasDecimais(sup), casasDecimais(inf));
    if (sup !== null && inf !== null && Math.abs(sup - inf) < EPS && sup > 0) return '± ' + u.fmt(sup, cs);
    return '+' + u.fmt(sup || 0, cs) + ' / −' + u.fmt(inf || 0, cs);
  }

  /** Faixa aceita, ex.: "17,5 a 20,5" ou "≥ 16". */
  function textoLimites(c) {
    const lim = limites(c);
    if (!lim) return '';
    if (c.criterio === 'exato') return '= ' + u.fmt(lim.min);
    const casas = temValor(c.tolPct) ? 2 : Math.max(casasDecimais(c.nominal), casasDecimais(c.tolSup), casasDecimais(c.tolInf));
    if (lim.max === Infinity) return '≥ ' + u.fmt(lim.min, casas);
    if (lim.min === -Infinity) return '≤ ' + u.fmt(lim.max, casas);
    return u.fmt(lim.min, casas) + ' a ' + u.fmt(lim.max, casas);
  }

  function casasDecimais(v) {
    const n = u.num(v);
    if (isNaN(n)) return 0;
    const s = String(n);
    return s.indexOf('.') >= 0 ? Math.min(2, s.split('.')[1].length) : 0;
  }

  /** Resumo do relatório e resultado sugerido. */
  function resumo(rel) {
    const r = {
      cotas: { total: 0, ok: 0, nc: 0, parcial: 0, pendente: 0, avaliar: 0, na: 0 },
      visual: { total: 0, C: 0, NC: 0, NA: 0, pendente: 0 },
      sugestao: null, completo: false
    };
    (rel.cotas || []).forEach(c => { r.cotas.total++; r.cotas[cota(c)]++; });
    (rel.visual || []).forEach(v => { r.visual.total++; if (v.resp) r.visual[v.resp]++; else r.visual.pendente++; });
    const temNc = r.cotas.nc > 0 || r.visual.NC > 0;
    r.completo = r.cotas.total > 0 && r.cotas.pendente === 0 && r.cotas.parcial === 0 && r.cotas.avaliar === 0 && r.visual.pendente === 0;
    if (temNc) r.sugestao = 'reprovado';
    else if (r.completo) r.sugestao = 'aprovado';
    return r;
  }

  /** Cota sem tolerância: maior distância entre as medidas e o nominal, quando passa do aviso
      (0,5 mm ou 1,5 % do nominal, o que for maior). null quando não há desvio grande. */
  function desvio(c) {
    if (limites(c) || c.sitManual === 'na') return null;
    const nom = u.num(c.nominal);
    if (isNaN(nom)) return null;
    const lim = Math.max(0.5, Math.abs(nom) * 0.015);
    let max = 0;
    (c.medidas || []).forEach(m => { const v = u.num(m); if (!isNaN(v)) max = Math.max(max, Math.abs(v - nom)); });
    return max > lim + EPS ? { max: Math.round(max * 1000) / 1000, lim: Math.round(lim * 100) / 100 } : null;
  }

  const ROTULO = { ok: 'Conforme', nc: 'Não conforme', parcial: 'Incompleto', pendente: 'Pendente', avaliar: 'Avaliar', na: 'N/A' };

  return { limites, medida, cota, textoTol, textoLimites, resumo, desvio, ROTULO };
})();

/* ==========================================================
   RIF — relatório A4 (mesmo HTML para a tela e a impressão)
   ========================================================== */
RIF.relatorio = (function () {
  const u = RIF.u;
  const e = u.esc;

  function campo(k, v) {
    return '<td><span class="k">' + e(k) + '</span><span class="v">' + (v ? e(v) : '&nbsp;') + '</span></td>';
  }

  function textoMedida(t) {
    const v = u.num(t);
    return isNaN(v) ? '' : u.fmt(v, Math.min(2, (String(t).split(/[.,]/)[1] || '').length));
  }

  function situacao(c) {
    const s = RIF.aval.cota(c);
    if (s === 'ok') return '<span class="rp-sit s-ok">C</span>';
    if (s === 'nc') return '<span class="rp-sit s-nc">NC</span>';
    if (s === 'na') return '<span class="rp-sit s-na">N/A</span>';
    return '<span class="rp-sit s-pend">—</span>';
  }

  function tabelaDimensional(rel) {
    const n = rel.pecas || 1;
    let cab = '<tr><th style="width:34px">Cód.</th><th>Cota</th><th style="width:56px">Nominal</th><th style="width:70px">Tolerância</th>';
    for (let i = 1; i <= n; i++) cab += '<th>P' + i + '</th>';
    cab += '<th style="width:40px">Sit.</th></tr>';
    const linhas = (rel.cotas || []).map(c => {
      let tr = '<tr><td class="cod">' + e(c.cod) + (c.corrigida ? '<sup>*</sup>' : '') + '</td><td class="esq">' + e(c.desc) + '</td>';
      const nom = u.num(c.nominal);
      tr += '<td>' + (isNaN(nom) ? '—' : u.fmt(nom)) + (c.criterio === 'min' ? '<small>mín.</small>' : '') + '</td>';
      const lim = RIF.aval.textoLimites(c);
      tr += '<td>' + e(RIF.aval.textoTol(c)) + (lim && c.criterio !== 'exato' ? '<small>' + e(lim) + '</small>' : '') + '</td>';
      for (let i = 0; i < n; i++) {
        const t = (c.medidas || [])[i];
        const st = c.sitManual === 'na' ? '' : RIF.aval.medida(c, t);
        tr += '<td' + (st === 'nc' ? ' class="nc"' : '') + '>' + (c.sitManual === 'na' ? '—' : e(textoMedida(t))) + '</td>';
      }
      tr += '<td>' + situacao(c) + '</td></tr>';
      return tr;
    }).join('');
    return '<table class="rp-tab"><thead>' + cab + '</thead><tbody>' + linhas + '</tbody></table>';
  }

  /** Nota das cotas corrigidas pela Qualidade (valor da norma, motivo, responsável e data). */
  function notaCorrecoes(rel) {
    const l = (rel.cotas || []).filter(c => c.corrigida);
    if (!l.length) return '';
    const k = l[0].corrigida;
    return '<div class="rp-nota rp-corr">* Valor corrigido pela Qualidade em relação à norma — ' +
      l.map(c => e(c.cod) + ': na norma ' + e(c.corrigida.norma.texto)).join('; ') + '.' +
      (k.motivo ? ' Motivo: ' + e(k.motivo) + '.' : '') +
      (k.responsavel ? ' (' + e(k.responsavel) + (k.data ? ', ' + e(k.data) : '') + ')' : '') + '</div>';
  }

  /** Cotas sem tolerância marcadas conforme com desvio grande: justificativa do inspetor. */
  function notaJust(rel) {
    const l = (rel.cotas || []).filter(c => c.just && c.sitManual === 'ok');
    if (!l.length) return '';
    return '<div class="rp-nota rp-corr">Cota sem tolerância aceita com desvio — ' + l.map(c => e(c.cod) + ': ' + e(c.just)).join('; ') + '.</div>';
  }

  function tabelaVisual(rel) {
    const itens = rel.visual || [];
    if (!itens.length) return '<div class="rp-nota">Sem itens de inspeção visual.</div>';
    const x = (v, r) => v === r ? '<span class="rp-x">X</span>' : '';
    return '<table class="rp-tab"><thead><tr><th>Item verificado</th><th style="width:30px">C</th><th style="width:30px">NC</th><th style="width:30px">N/A</th></tr></thead><tbody>' +
      itens.map(v => '<tr><td class="esq">' + e(v.texto) + '</td><td>' + x(v.resp, 'C') + '</td><td' + (v.resp === 'NC' ? ' class="nc"' : '') + '>' + x(v.resp, 'NC') + '</td><td>' + x(v.resp, 'NA') + '</td></tr>').join('') +
      '</tbody></table>';
  }

  function tabelaInstrumentos(rel) {
    const l = rel.instrumentos || [];
    if (!l.length) return '<div class="rp-nota">Nenhum instrumento informado.</div>';
    const dataRef = rel.dataInspecao || u.hojeISO();
    return '<table class="rp-tab"><thead><tr><th style="width:70px">Código</th><th>Instrumento</th><th style="width:66px">Calibração válida até</th></tr></thead><tbody>' +
      l.map(i => {
        const vencido = i.validade && i.validade < dataRef;
        return '<tr><td class="cod">' + e(i.codigo) + '</td><td class="esq">' + e(i.descricao) + '</td><td' + (vencido ? ' class="nc"' : '') + '>' + e(u.dataBR(i.validade)) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /** Monta o HTML do relatório. ctx = { empresa, validacao } */
  function html(rel, ctx) {
    ctx = ctx || {};
    const emp = ctx.empresa || {};
    const id = rel.ident || {};
    const rascunho = rel.status !== 'finalizado';
    const res = rel.resultado;
    const logo = emp.logo ? '<img src="' + emp.logo + '" alt="">' : '<div class="mono">' + e((emp.sigla || 'AV').slice(0, 3)) + '</div>';
    const prod = rel.produto || {};
    const porNorma = prod.modo !== 'desenho';
    const norma = porNorma && prod.normaNome ? prod.normaNome : '';
    const referencia = !porNorma && prod.referencia ? prod.referencia : '';
    const val = prod.validacao;

    let h = '<div class="rp' + (rascunho ? ' rp-rascunho' : '') + '">';
    if (rascunho) h += '<div class="rp-marca-dagua">RASCUNHO</div>';
    h += '<header class="rp-cab"><div class="rp-logo">' + logo + '</div>' +
      '<div class="rp-tit"><div class="rp-emp">' + e(emp.nome || 'Aços Vital') + '</div><h1>RELATÓRIO DE INSPEÇÃO FINAL</h1>' +
      '<div class="rp-sub">Inspeção dimensional e visual</div></div>' +
      '<table class="rp-num"><tr><th>Nº</th><td>' + e(rel.numero || 'RASCUNHO') + '</td></tr>' +
      '<tr><th>Data</th><td>' + e(u.dataBR(rel.dataInspecao)) + '</td></tr>' +
      '<tr><th>Resultado</th><td class="r-' + e(res || '') + '">' + (res ? e(res.toUpperCase()) : '—') + '</td></tr></table></header>';

    h += '<section class="rp-sec"><h2>1. Identificação</h2><div class="rp-caixa" style="padding:0"><table class="rp-kv"><tr>' +
      campo('Cliente', id.cliente) + campo('Pedido de venda', id.pv) + campo('Vendedor', id.vendedor) + campo('Quantidade', id.quantidade) +
      '</tr><tr>' + campo('Material', id.material) + campo('Lote AV', id.lote) + campo('Corrida', id.corrida) + campo('Nº do desenho', id.desenho) +
      '</tr><tr><td colspan="4"><span class="k">Sinete / marcação</span><span class="v">' + (id.sinete ? e(id.sinete) : '&nbsp;') + '</span></td></tr></table></div></section>';

    h += '<section class="rp-sec"><h2>2. Produto</h2><div class="rp-caixa rp-prod"><b>' + e(rel.produto && rel.produto.descricao || '—') + '</b>';
    if (norma) h += '<span>Norma: <b>' + e(norma) + '</b></span>';
    if (referencia) h += '<span>Referência: <b>' + e(referencia) + '</b></span>';
    if (prod.modo === 'norma') {
      h += val ? '<span class="val-ok">Combinação validada por ' + e(val.responsavel) + ' em ' + e(val.data) +
                 (val.correcoes ? ' — com correção de ' + val.correcoes + (val.correcoes > 1 ? ' valores' : ' valor') : '') + '</span>'
               : '<span class="val-pend">Combinação aguardando validação da Qualidade</span>';
    } else if (rel.cotas && rel.cotas.length) {
      h += '<span>Valores informados no relatório (produto manual)</span>';
    }
    if (rel.produto && rel.produto.nota) h += '<span>' + e(rel.produto.nota) + '</span>';
    h += '</div></section>';

    h += '<section class="rp-sec quebra-ok"><h2>3. Inspeção dimensional <span>(mm · ' + (rel.pecas || 1) + ' peça' + ((rel.pecas || 1) > 1 ? 's' : '') + ' medida' + ((rel.pecas || 1) > 1 ? 's' : '') + ')</span></h2>' +
      tabelaDimensional(rel) + notaCorrecoes(rel) + notaJust(rel) +
      '<div class="rp-nota">C = conforme · NC = não conforme · N/A = não aplicável · — = não avaliado. ' +
      (norma ? 'Tolerâncias conforme ' + e(norma) + '; cotas sem tolerância na norma avaliadas pelo inspetor.'
             : 'Nominais e tolerâncias informados no relatório' + (referencia ? ', conforme ' + e(referencia) : '') + '; cotas sem tolerância avaliadas pelo inspetor.') + '</div></section>';

    h += '<div class="rp-2col"><section class="rp-sec"><h2>4. Inspeção visual</h2>' + tabelaVisual(rel) + '</section>' +
      '<section class="rp-sec"><h2>5. Instrumentos de medição</h2>' + tabelaInstrumentos(rel) + '</section></div>';

    if ((rel.fotos || []).length) {
      h += '<section class="rp-sec"><h2>6. Registro fotográfico</h2><div class="rp-caixa"><div class="rp-fotos">' +
        rel.fotos.map(f => '<div class="rp-foto"><img src="' + f.dataUrl + '" alt=""><div>' + e(f.legenda || '') + '</div></div>').join('') +
        '</div></div></section>';
    }

    h += '<section class="rp-final"><div class="rp-resultado r-' + e(res || '') + '"><small>RESULTADO</small>' + (res ? e(res.toUpperCase()) : '—') + '</div>' +
      '<div class="rp-bloco"><h3>Observações</h3><p>' + e(rel.observacoes || '') + '</p></div>' +
      '<div class="rp-bloco rp-assin">' + (rel.assinEletr ? '<div class="rp-assel">Assinado eletronicamente<br>' + e(u.dataHoraBR(rel.assinEletr.em)) + '</div>' : rel.assinatura ? '<img src="' + rel.assinatura + '" alt="Assinatura">' : '<div style="height:40px"></div>') +
      '<div class="linha"></div><b>' + e(rel.inspetor || '') + '</b><span>Inspetor de Qualidade' + (rel.finalizadoEm ? ' · ' + e(u.dataHoraBR(rel.finalizadoEm)) : '') + '</span></div></section>';

    h += '<footer class="rp-rod"><span>' + e(emp.codigoFormulario || '') + '</span><span>' +
      (rascunho ? 'Rascunho — sem validade' : 'Emitido em ' + e(u.dataHoraBR(rel.finalizadoEm))) + '</span><span>' + e(rel.numero || '') + '</span></footer>';
    h += '</div>';
    return h;
  }

  /** Coloca o relatório na área de impressão e abre a janela de imprimir / salvar PDF. */
  function imprimir(rel, ctx) {
    let area = document.getElementById('area-impressao');
    if (!area) { area = document.createElement('div'); area.id = 'area-impressao'; document.body.appendChild(area); }
    area.innerHTML = html(rel, ctx);
    const tituloAntigo = document.title;
    document.title = rel.numero || ('RIF-rascunho-' + u.hojeISO());
    const imgs = Array.from(area.querySelectorAll('img'));
    Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; }))).then(() => {
      setTimeout(() => {
        window.print();
        setTimeout(() => { document.title = tituloAntigo; }, 500);
      }, 60);
    });
  }

  return { html, imprimir };
})();

/* ==========================================================
   RIF dentro da Central — relatório A4 no padrão dos irmãos
   (RNC vermelho · RIR verde · RIF azul-marinho).
   Mesmos dados do relatório original; muda só o desenho.
   Marcação dos itens: AP = aprovado · RP = reprovado · N/A.
   ========================================================== */
RIF.relatorio = (function () {
  const u = RIF.u;
  const e = u.esc;
  const vz = '<span class="rq-vz">—</span>';
  const tx = (v) => (v === null || v === undefined || v === '' ? vz : e(v));

  function textoMedida(t) {
    const v = u.num(t);
    return isNaN(v) ? '' : u.fmt(v, Math.min(2, (String(t).split(/[.,]/)[1] || '').length));
  }

  function situacao(c) {
    const s = RIF.aval.cota(c);
    if (s === 'ok') return '<span class="rq-s ap">AP</span>';
    if (s === 'nc') return '<span class="rq-s rp">RP</span>';
    if (s === 'na') return '<span class="rq-s na">N/A</span>';
    return '<span class="rq-vz">—</span>';
  }

  function tabelaDimensional(rel) {
    const n = rel.pecas || 1;
    let cab = '<tr><th class="c" style="width:9mm">Cód.</th><th>Cota</th><th class="c" style="width:16mm">Nominal</th><th class="c" style="width:21mm">Tolerância</th>';
    for (let i = 1; i <= n; i++) cab += '<th class="c">P' + i + '</th>';
    cab += '<th class="c" style="width:12mm">Sit.</th></tr>';
    const linhas = (rel.cotas || []).map(c => {
      const just = c.just && c.sitManual === 'ok';
      let tr = '<tr><td class="cod">' + e(c.cod) + (c.corrigida ? '<sup>*</sup>' : '') + '</td><td>' + e(c.desc) + '</td>';
      const nom = u.num(c.nominal);
      tr += '<td class="c">' + (isNaN(nom) ? '—' : u.fmt(nom)) + (c.criterio === 'min' ? '<small>mín.</small>' : '') + '</td>';
      const lim = RIF.aval.textoLimites(c);
      tr += '<td class="c">' + e(RIF.aval.textoTol(c)) + (lim && c.criterio !== 'exato' ? '<small>' + e(lim) + '</small>' : '') + '</td>';
      for (let i = 0; i < n; i++) {
        const t = (c.medidas || [])[i];
        const st = c.sitManual === 'na' ? '' : RIF.aval.medida(c, t);
        tr += '<td class="c' + (st === 'nc' ? ' fora' : '') + '">' + (c.sitManual === 'na' ? '—' : e(textoMedida(t))) + '</td>';
      }
      tr += '<td class="c">' + situacao(c) + (just ? '<sup>†</sup>' : '') + '</td></tr>';
      return tr;
    }).join('');
    return '<table class="rq-dim">' + cab + linhas + '</table>';
  }

  function notas(rel, norma, referencia) {
    const l = [];
    const corr = (rel.cotas || []).filter(c => c.corrigida);
    if (corr.length) {
      const k = corr[0].corrigida;
      l.push('<b>* Valor corrigido pela Qualidade em relação à norma — ' +
        corr.map(c => e(c.cod) + ': na norma ' + e(c.corrigida.norma.texto)).join('; ') + '.' +
        (k.motivo ? ' Motivo: ' + e(k.motivo) + '.' : '') +
        (k.responsavel ? ' (' + e(k.responsavel) + (k.data ? ', ' + e(k.data) : '') + ')' : '') + '</b>');
    }
    const just = (rel.cotas || []).filter(c => c.just && c.sitManual === 'ok');
    if (just.length) l.push('<b>† Cota sem tolerância aceita com desvio — ' + just.map(c => e(c.cod) + ': ' + e(c.just)).join('; ') + '.</b>');
    l.push('AP = aprovado · RP = reprovado · N/A = não se aplica · — = não avaliado. ' +
      (norma ? 'Tolerâncias conforme ' + e(norma) + '; cotas sem tolerância na norma avaliadas pelo inspetor.'
             : 'Nominais e tolerâncias informados no relatório' + (referencia ? ', conforme ' + e(referencia) : '') + '; cotas sem tolerância avaliadas pelo inspetor.'));
    return l.map(x => '<div class="rq-nota">' + x + '</div>').join('');
  }

  function blocoVisual(rel) {
    const itens = rel.visual || [];
    if (!itens.length) return '<div class="rq-sig">' + vz + ' Sem itens de inspeção visual.</div>';
    const tri = (r) => ['C', 'NC', 'NA'].map(o => '<b class="' + (r === o ? (o === 'C' ? 'ap' : o === 'NC' ? 'rp' : 'na') : '') + '">' + (o === 'C' ? 'AP' : o === 'NC' ? 'RP' : 'N/A') + '</b>').join('');
    return '<div class="rq-vis">' + itens.map(v => '<div><span>' + e(v.texto) + '</span><span class="rq-tri">' + tri(v.resp) + '</span></div>').join('') + '</div>';
  }

  function tabelaInstrumentos(rel) {
    const l = rel.instrumentos || [];
    if (!l.length) return '<div class="rq-sig">' + vz + ' Nenhum instrumento informado.</div>';
    const dataRef = rel.dataInspecao || u.hojeISO();
    return '<table><tr><th style="width:24mm">Código</th><th>Instrumento</th><th style="width:44mm">Calibração válida até</th></tr>' +
      l.map(i => {
        const vencido = i.validade && i.validade < dataRef;
        return '<tr><td><b>' + e(i.codigo) + '</b></td><td>' + e(i.descricao) + '</td><td' + (vencido ? ' class="fora"' : '') + '>' + e(u.dataBR(i.validade)) + '</td></tr>';
      }).join('') + '</table>';
  }

  /** Monta o HTML do relatório. ctx = { empresa, validacao } */
  function html(rel, ctx) {
    ctx = ctx || {};
    const emp = ctx.empresa || {};
    const id = rel.ident || {};
    const rascunho = rel.status !== 'finalizado';
    const res = rel.resultado;
    const prod = rel.produto || {};
    const porNorma = prod.modo !== 'desenho';
    const norma = porNorma && prod.normaNome ? prod.normaNome : '';
    const referencia = !porNorma && prod.referencia ? prod.referencia : '';
    const val = prod.validacao;
    const logo = emp.logo ? '<img src="' + emp.logo + '" alt="">' : '<b>' + e(emp.nome || 'AÇOS VITAL') + '</b>';
    const quando = rel.finalizadoEm ? u.dataHoraBR(rel.finalizadoEm) : u.dataBR(rel.dataInspecao);
    const resTxt = res === 'aprovado' ? 'APROVADO' : res === 'reprovado' ? 'REPROVADO' : '—';
    const resCls = res === 'aprovado' ? 'ap' : res === 'reprovado' ? 'rp' : '';
    const nRP = (rel.cotas || []).filter(c => RIF.aval.cota(c) === 'nc').length;
    const rodE = 'Aços Vital · Qualidade · Relatório de Inspeção Final' + (emp.codigoFormulario ? ' · ' + emp.codigoFormulario : '');
    const rodD = (rel.numero || 'Rascunho — sem validade');
    const css = (s) => String(s).replace(/["\\]/g, '');

    let h = '<style>@page{@bottom-left{content:"' + css(rodE) + '"}@bottom-right{content:"' + css(rodD) + ' · página " counter(page) " de " counter(pages)}}</style>';
    h += '<div class="rq' + (rascunho ? ' rq-rasc' : '') + '">';
    if (rascunho) h += '<div class="rq-marca">RASCUNHO</div>';

    h += '<div class="rq-hd"><div class="lg">' + logo + '</div><div class="t"><b>RELATÓRIO DE INSPEÇÃO FINAL</b><span>Inspeção dimensional e visual' + (id.pv ? ' · PV ' + e(id.pv) : '') + '</span></div>' +
      '<div class="n"><div class="rn">' + e(rel.numero || 'RASCUNHO') + '</div><div><span>Inspeção</span><b>' + e(quando || '—') + '</b></div>' +
      '<div><span>Resultado</span><b class="' + resCls + '">' + resTxt + '</b></div></div></div>';

    h += '<div class="rq-sec"><div class="sh">1 · Identificação</div><table>' +
      '<tr><td class="k">Cliente</td><td>' + tx(id.cliente) + '</td><td class="k k2">Pedido (PV)</td><td>' + tx(id.pv) + '</td><td class="k k2">Vendedor</td><td>' + tx(id.vendedor) + '</td></tr>' +
      '<tr><td class="k">Quantidade</td><td>' + (id.quantidade ? e(id.quantidade) + ' pç' : vz) + '</td><td class="k k2">Material</td><td>' + tx(id.material) + '</td><td class="k k2">Corrida</td><td>' + tx(id.corrida) + '</td></tr>' +
      '<tr><td class="k">Lote AV</td><td>' + tx(id.lote) + '</td><td class="k k2">Nº desenho</td><td>' + tx(id.desenho) + '</td><td class="k k2">Sinete</td><td>' + tx(id.sinete) + '</td></tr></table></div>';

    let comb = '';
    if (prod.modo === 'norma') {
      comb = val ? '<span class="rq-val ok">✓ Validada</span> por ' + e(val.responsavel) + ' em ' + e(val.data) +
                   (val.correcoes ? ' — com correção de ' + val.correcoes + (val.correcoes > 1 ? ' valores' : ' valor') : '')
                 : '<span class="rq-val pend">! Aguardando validação da Qualidade</span>';
    } else if (rel.cotas && rel.cotas.length) comb = 'Valores informados no relatório (produto manual)';
    h += '<div class="rq-sec"><div class="sh">2 · Produto</div><table>' +
      '<tr><td class="k">Produto</td><td><b>' + tx(prod.descricao) + '</b></td><td class="k k2">' + (referencia ? 'Referência' : 'Norma') + '</td><td>' + tx(norma || referencia) + '</td></tr>' +
      (comb ? '<tr><td class="k">Combinação</td><td colspan="3">' + comb + '</td></tr>' : '') +
      (prod.nota ? '<tr><td class="k">Nota</td><td colspan="3">' + e(prod.nota) + '</td></tr>' : '') + '</table></div>';

    const np = rel.pecas || 1;
    h += '<div class="rq-sec rq-quebra"><div class="sh">3 · Inspeção dimensional <span>mm · ' + np + ' peça' + (np > 1 ? 's' : '') + ' medida' + (np > 1 ? 's' : '') + '</span></div>' +
      tabelaDimensional(rel) + notas(rel, norma, referencia) + '</div>';

    h += '<div class="rq-sec"><div class="sh">4 · Inspeção visual <span>AP = aprovado · RP = reprovado · N/A = não se aplica</span></div>' + blocoVisual(rel) + '</div>';
    h += '<div class="rq-sec"><div class="sh">5 · Instrumentos de medição</div>' + tabelaInstrumentos(rel) + '</div>';

    let sec = 6;
    if ((rel.fotos || []).length) {
      h += '<div class="rq-sec"><div class="sh">' + (sec++) + ' · Registro fotográfico</div><div class="rq-fotos">' +
        rel.fotos.map(f => '<div><img src="' + f.dataUrl + '" alt=""><span>' + e(f.legenda || '') + '</span></div>').join('') + '</div></div>';
    }

    const insp = rel.assinEletr
      ? '<b>' + e(rel.inspetor || '') + '</b> — assinado eletronicamente em ' + e(u.dataHoraBR(rel.assinEletr.em)).replace(' ', ' às ')
      : rel.assinatura ? '<b>' + e(rel.inspetor || '') + '</b><br><img class="rq-ass" src="' + rel.assinatura + '" alt="Assinatura">'
      : (rel.inspetor ? '<b>' + e(rel.inspetor) + '</b> — ' : '') + '<span class="rq-vz">assinatura ao finalizar</span>';
    h += '<div class="rq-sec"><div class="sh">' + sec + ' · Resultado da inspeção</div>' +
      '<div class="rq-sum"><div><span>Peças do item</span><b>' + (id.quantidade ? e(id.quantidade) : '—') + '</b></div><div><span>Peças medidas</span><b>' + np + '</b></div>' +
      '<div><span>Cotas reprovadas</span><b class="' + (nRP ? 'rp' : 'ap') + '">' + nRP + '</b></div><div><span>Parecer</span><b class="' + resCls + '">' + resTxt + '</b></div></div><table>' +
      '<tr><td class="k">Observações</td><td>' + tx(rel.observacoes) + '</td></tr>' +
      '<tr><td class="k">Inspetor</td><td>' + insp + '</td></tr></table></div>';

    h += '<div class="rq-ft"><span>' + e(rodE) + '</span><span>' + e(rodD) + '</span></div>';
    h += '</div>';
    return h;
  }

  /** Coloca o relatório na área de impressão e abre a janela de imprimir / salvar PDF. */
  function imprimir(rel, ctx) {
    let area = document.getElementById('area-impressao');
    if (!area) { area = document.createElement('div'); area.id = 'area-impressao'; document.body.appendChild(area); }
    area.innerHTML = html(rel, ctx);
    const tituloAntigo = document.title;
    document.title = rel.numero || ('RIF-rascunho-' + u.hojeISO());
    const imgs = Array.from(area.querySelectorAll('img'));
    Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; }))).then(() => {
      setTimeout(() => {
        window.print();
        setTimeout(() => { document.title = tituloAntigo; }, 500);
      }, 60);
    });
  }

  return { html, imprimir };
})();

/* ==========================================================
   RIF — tela de preenchimento do relatório (rascunho)
   ========================================================== */
RIF.vEditor = (function () {
  const u = RIF.u, ui = RIF.ui, A = RIF.aval, N = RIF.normas;
  const esc = u.esc;
  const MAX_PECAS = 10, MAX_FOTOS = 6;
  let E = null; // estado da tela aberta

  const SECOES = [
    { id: 'produto', titulo: 'Produto' },
    { id: 'ident', titulo: 'Identificação' },
    { id: 'dim', titulo: 'Dimensional' },
    { id: 'visual', titulo: 'Inspeção visual' },
    { id: 'instr', titulo: 'Instrumentos' },
    { id: 'fotos', titulo: 'Fotos' },
    { id: 'result', titulo: 'Resultado' }
  ];

  const cfg = () => RIF.app.estado.cfg;

  /* =======================================================
     Montagem
     ======================================================= */
  function render(main, rel) {
    normalizar(rel);
    E = { rel: rel, main: main, gravando: Promise.resolve(), ro: null };
    E.salvar = u.debounce(gravar, 700);
    const corrigiu = sincronizarCorrecoes();

    main.innerHTML =
      '<div class="ed-cab" id="ed-cab"></div>' +
      '<nav class="indice" id="ed-indice" aria-label="Seções do relatório"></nav>' +
      SECOES.map((s, i) =>
        '<section class="card" id="sec-' + s.id + '">' +
          '<header class="card-cab"><span class="passo" data-passo="' + s.id + '">' + (i + 1) + '</span>' +
          '<div><h2>' + s.titulo + '</h2><div class="sub" id="sub-' + s.id + '"></div></div>' +
          '<div class="card-cab-dir" id="dir-' + s.id + '"></div></header>' +
          '<div class="card-corpo" id="corpo-' + s.id + '"></div>' +
        '</section>').join('') +
      '<div class="barra-acoes">' +
        '<button type="button" class="btn-icone perigo" data-acao="excluir" title="Excluir rascunho" aria-label="Excluir rascunho">' + ui.icon('trash') + '</button>' +
        '<span class="salvo" id="ed-salvo"></span><span class="esp"></span>' +
        '<button type="button" class="btn btn-sec" data-acao="imprimir">' + ui.icon('printer') + '<span>Prévia</span></button>' +
        '<button type="button" class="btn btn-pri" data-acao="finalizar">' + ui.icon('check') + '<span>Finalizar RIF</span></button>' +
      '</div>';

    pintarTudo();
    ligarEventos();
    if (corrigiu) {
      E.salvar();
      ui.toast('Valores da norma atualizados conforme a validação da Qualidade.', 'info', 5000);
    }
    return async function sair() {
      E.salvar.flush();
      await E.gravando;
      if (E.ro) E.ro.disconnect();
      window.removeEventListener('resize', E.aoRedimensionar);
    };
  }

  function normalizar(rel) {
    rel.pecas = Math.max(1, Math.min(MAX_PECAS, +rel.pecas || 1));
    rel.ident = rel.ident || {};
    rel.cotas = rel.cotas || [];
    rel.cotas.forEach(c => {
      c.medidas = (c.medidas || []).slice(0, rel.pecas);
      while (c.medidas.length < rel.pecas) c.medidas.push('');
    });
    rel.visual = rel.visual || [];
    rel.instrumentos = rel.instrumentos || [];
    rel.fotos = rel.fotos || [];
    if (RIF.embed && rel.status !== 'finalizado') rel.inspetor = RIF.hostMe();
  }

  function gravar() {
    E.gravando = E.gravando.then(() => RIF.db.relatorios.salvar(E.rel)).then(() => {
      const s = document.getElementById('ed-salvo');
      if (s) s.textContent = 'Salvo às ' + u.horaBR();
    }).catch(err => { console.error(err); ui.toast('Não foi possível salvar: ' + err.message, 'erro'); });
    return E.gravando;
  }

  function pintarTudo() {
    pintarCab();
    pintarProduto();
    pintarIdent();
    pintarDim();
    pintarVisual();
    pintarInstr();
    pintarFotos();
    pintarResultado();
    atualizarResumo();
  }

  /* =======================================================
     Cabeçalho, índice e resumos
     ======================================================= */
  function pintarCab() {
    const r = E.rel;
    document.getElementById('ed-cab').innerHTML =
      '<div class="ed-cab-tit"><div class="linha1"><span class="pill pill-av">' + ui.icon('editar') + 'Rascunho</span>' +
      '<span class="sub" style="font-size:13px;color:var(--txt-3)">número gerado ao finalizar</span></div>' +
      '<h1 id="ed-titulo">' + esc(r.produto.descricao || 'Novo relatório de inspeção') + '</h1></div>' +
      '<div class="ed-cab-info"><span>Data da inspeção</span><b>' + esc(u.dataBR(r.dataInspecao)) + '</b></div>';
  }

  function estadoSecoes() {
    const r = E.rel, res = A.resumo(r);
    const id = r.ident || {};
    return {
      res: res,
      feito: {
        produto: r.cotas.length > 0,
        ident: !!(id.quantidade && (id.cliente || id.pv)),
        dim: res.cotas.total > 0 && !res.cotas.pendente && !res.cotas.parcial && !res.cotas.avaliar,
        visual: res.visual.pendente === 0,
        instr: r.instrumentos.length > 0,
        fotos: r.fotos.length > 0,
        result: !!(r.resultado && r.inspetor)
      },
      nc: { dim: res.cotas.nc > 0, visual: res.visual.NC > 0 }
    };
  }

  function atualizarResumo() {
    const st = estadoSecoes(), r = E.rel, res = st.res;
    // índice
    document.getElementById('ed-indice').innerHTML = SECOES.map((s, i) =>
      '<a href="#sec-' + s.id + '" data-ir="' + s.id + '" class="' + (st.nc[s.id] ? 'tem-nc' : '') + '">' +
      '<span class="passo' + (st.feito[s.id] ? ' feito' : '') + '">' + (st.feito[s.id] ? ui.icon('check') : (i + 1)) + '</span>' + s.titulo + '</a>').join('');
    // números dos cartões
    SECOES.forEach((s, i) => {
      const p = document.querySelector('[data-passo="' + s.id + '"]');
      if (p) { p.classList.toggle('feito', st.feito[s.id]); p.innerHTML = st.feito[s.id] ? ui.icon('check') : String(i + 1); }
    });
    // subtítulos
    const c = res.cotas;
    sub('produto', r.cotas.length ? (r.produto.modo === 'norma' ? (r.produto.normaNome || '') : 'Produto manual' + (r.produto.referencia ? ' · ' + r.produto.referencia : '')) : 'Escolha a norma e a combinação');
    sub('dim', c.total ? (c.ok + ' de ' + (c.total - c.na) + ' cotas aprovadas' + (c.nc ? ' · ' + c.nc + ' RP' : '') + (c.na ? ' · ' + c.na + ' N/A' : '')) : 'Sem cotas — escolha o produto');
    const v = res.visual;
    sub('visual', v.total ? ((v.total - v.pendente) + ' de ' + v.total + ' itens verificados' + (v.NC ? ' · ' + v.NC + ' NC' : '')) : 'Sem itens cadastrados');
    sub('instr', r.instrumentos.length ? r.instrumentos.length + ' selecionado(s)' : 'Nenhum selecionado');
    sub('fotos', r.fotos.length + ' de ' + MAX_FOTOS);
    sub('ident', r.ident.cliente ? r.ident.cliente : 'Cliente, pedido, lote e corrida');
    sub('result', r.resultado ? r.resultado.toUpperCase() : 'Aguardando');
    // pílula no cabeçalho do dimensional
    const dir = document.getElementById('dir-dim');
    if (dir) dir.innerHTML = c.nc ? '<span class="pill pill-nc">' + ui.icon('x') + c.nc + ' RP</span>' : (st.feito.dim ? '<span class="pill pill-ok">' + ui.icon('check') + 'OK</span>' : '');
    pintarSugestao(res);
  }

  function sub(id, t) { const el = document.getElementById('sub-' + id); if (el) el.textContent = t; }

  /* =======================================================
     1. Produto
     ======================================================= */
  function pintarProduto() {
    const r = E.rel, p = r.produto;
    let h = '<div class="seg prod-modo" role="group" aria-label="Tipo de produto">' +
      '<button type="button" data-acao="modo" data-v="norma" class="' + (p.modo === 'norma' ? 'sel' : '') + '">Por norma</button>' +
      '<button type="button" data-acao="modo" data-v="desenho" class="' + (p.modo === 'desenho' ? 'sel' : '') + '">Manual / desenho</button></div>';

    if (p.modo === 'norma') {
      const normas = N.todas();
      const n = N.obter(p.normaId);
      h += '<div class="campos">';
      if (normas.length > 1 || !n) {
        h += '<div class="campo"><label for="sel-norma">Norma</label><select class="inp" id="sel-norma" data-acao-change="norma">' +
          '<option value="">— Escolha —</option>' +
          normas.map(x => '<option value="' + esc(x.id) + '"' + (x.id === p.normaId ? ' selected' : '') + '>' + esc(N.nome(x) + ' — ' + x.titulo) + '</option>').join('') +
          '</select></div>';
      }
      if (n) {
        n.seletores.forEach((s, i) => {
          const liberado = n.seletores.slice(0, i).every(x => p.sel[x.id]);
          const ops = liberado ? N.opcoes(n, i, p.sel) : [];
          h += '<div class="campo"><label for="sel-' + s.id + '">' + esc(s.rotulo) + '</label>' +
            '<select class="inp" id="sel-' + s.id + '" data-sel="' + esc(s.id) + '"' + (liberado ? '' : ' disabled') + '>' +
            '<option value="">' + (liberado ? '— Escolha —' : '—') + '</option>' +
            ops.map(o => '<option value="' + esc(o.valor) + '"' + (o.valor === p.sel[s.id] ? ' selected' : '') + '>' + esc(o.rotulo) + '</option>').join('') +
            '</select></div>';
        });
      }
      h += '</div>';
      if (!normas.length) h += '<div class="aviso aviso-av" style="margin-top:12px">' + ui.icon('alerta') + '<span>Nenhuma norma carregada. Confira a pasta <b>normas</b>.</span></div>';
    } else {
      const prods = cfg().produtos || [];
      h += '<div class="campos">' +
        '<div class="campo"><label for="sel-prod">Produto cadastrado</label><select class="inp" id="sel-prod" data-acao-change="produto-desenho">' +
        '<option value="">— Cotas livres —</option>' +
        prods.map(x => '<option value="' + esc(x.id) + '"' + (x.id === p.produtoId ? ' selected' : '') + '>' + esc(x.nome) + '</option>').join('') +
        '</select></div>' +
        '<div class="campo campo-largo"><label for="inp-desc">Descrição do produto</label>' +
        '<input class="inp maiusc" id="inp-desc" data-campo="produto.descricao" value="' + esc(p.descricao || '') + '" placeholder="Ex.: Flange especial conforme desenho"></div>' +
        '<div class="campo campo-largo"><label for="inp-ref">Norma ou especificação de referência <span class="opc">(sai no relatório)</span></label>' +
        '<input class="inp maiusc" id="inp-ref" data-campo="produto.referencia" value="' + esc(p.referencia || '') + '" placeholder="Ex.: MSS SP-44 · desenho do cliente · especificação"></div>' +
        '</div>' +
        '<p class="ajuda" style="margin-top:10px">Use para norma que ainda não está no app, desenho ou peça especial: nominal e tolerância de cada cota são digitados aqui' +
        (prods.length ? ' (ou vêm do produto cadastrado).' : '. Para não digitar sempre, cadastre o produto em Configurações › Produtos manuais.') + '</p>';
    }

    if (p.modo === 'norma' && r.cotas.length) {
      const val = RIF.app.estado.validacoes[p.chave];
      const nCorr = r.cotas.filter(c => c.corrigida).length;
      h += '<div class="prod-resumo"><div><b>' + esc(p.descricao) + '</b>' +
        (p.nota ? '<div class="ajuda' + (/^Aten/.test(p.nota) ? ' nota-alerta' : '') + '" style="margin-top:3px">' + esc(p.nota) + '</div>' : '') +
        (nCorr ? '<div class="ajuda nota-corr" style="margin-top:3px">' + nCorr + (nCorr > 1 ? ' valores corrigidos' : ' valor corrigido') + ' pela Qualidade em relação à norma' + (val && val.motivo ? ': ' + esc(val.motivo) : '') + '.</div>' : '') + '</div>' +
        (val ? '<span class="pill pill-ok">' + ui.icon('escudo') + 'Validado pela Qualidade</span>'
             : '<span class="pill pill-av" title="A Qualidade ainda não conferiu esta combinação com a norma física">' + ui.icon('alerta') + 'Aguardando validação</span>') +
        '</div>';
    }
    document.getElementById('corpo-produto').innerHTML = h;
  }

  function temMedidas() {
    return E.rel.cotas.some(c => c.medidas.some(m => String(m || '').trim() !== '') || c.sitManual);
  }

  async function podeTrocarProduto() {
    if (!temMedidas()) return true;
    return ui.confirmar('Trocar o produto apaga as medições já digitadas. Continuar?', { titulo: 'Trocar produto', ok: 'Trocar', perigo: true });
  }

  /** Troca os itens visuais vindos da norma (os do cadastro geral ficam). */
  function definirVisuaisDaNorma(textos) {
    const r = E.rel;
    const antigos = {};
    r.visual.filter(v => v.origem === 'norma').forEach(v => { antigos[v.texto] = v.resp; });
    r.visual = r.visual.filter(v => v.origem !== 'norma').concat((textos || []).map(t => ({
      id: u.uid(), texto: t, resp: antigos[t] || null, origem: 'norma'
    })));
  }

  /** Cotas da norma para a combinação, já com as correções gravadas pela Qualidade na validação. */
  function cotasDaNorma(n, sel) {
    return N.aplicarCorrecoes(N.cotas(n, sel), RIF.app.estado.validacoes[N.chave(n, sel)]);
  }

  /** Rascunho aberto: traz as correções (ou a retirada delas) feitas pela Qualidade depois que as cotas foram
      carregadas. Mantém as medições; nas cotas que o inspetor digita (pedido), não mexe no nominal. */
  function sincronizarCorrecoes() {
    const r = E.rel, p = r.produto;
    if (p.modo !== 'norma' || !p.chave) return false;
    const n = N.obter(p.normaId);
    if (!n || !N.selecaoCompleta(n, p.sel)) return false;
    const atual = {};
    cotasDaNorma(n, p.sel).forEach(c => { atual[N.chaveCota(c)] = c; });
    let mudou = false;
    r.cotas.forEach(c => {
      if (c.origem !== 'norma') return;
      const b = atual[N.chaveCota(c)];
      if (!b || (!b.corrigida && !c.corrigida)) return;
      const antes = JSON.stringify([c.nominal, c.tolSup, c.tolInf, c.tolPct, c.refTol, c.nota, c.corrigida || null]);
      const campos = c.editavel ? ['tolSup', 'tolInf', 'tolPct', 'refTol', 'nota'] : ['nominal', 'tolSup', 'tolInf', 'tolPct', 'refTol', 'nota'];
      campos.forEach(k => { c[k] = b[k]; });
      if (b.corrigida) c.corrigida = b.corrigida; else delete c.corrigida;
      if (JSON.stringify([c.nominal, c.tolSup, c.tolInf, c.tolPct, c.refTol, c.nota, c.corrigida || null]) !== antes) mudou = true;
    });
    return mudou;
  }

  function aplicarNorma() {
    const r = E.rel, p = r.produto, n = N.obter(p.normaId);
    const extras = r.cotas.filter(c => c.origem === 'manual');
    definirVisuaisDaNorma(n && N.selecaoCompleta(n, p.sel) ? N.itensVisuais(n, p.sel) : []);
    if (n && N.selecaoCompleta(n, p.sel)) {
      const novas = cotasDaNorma(n, p.sel);
      novas.forEach(c => { c.medidas = new Array(r.pecas).fill(''); });
      r.cotas = novas.concat(extras);
      p.descricao = N.descricao(n, p.sel);
      p.normaNome = N.nome(n);
      p.nota = N.notaRegistro(n, p.sel);
      p.chave = N.chave(n, p.sel);
      p.toleranciasConferidas = n.toleranciasConferidas !== false;
      p.notaTolerancias = n.notaTolerancias || '';
    } else {
      r.cotas = extras;
      p.descricao = ''; p.chave = null; p.nota = '';
    }
  }

  function aplicarDesenho(prodId) {
    const r = E.rel, p = r.produto;
    const prod = (cfg().produtos || []).find(x => x.id === prodId);
    p.produtoId = prod ? prod.id : null;
    if (prod) p.descricao = u.maiusc(prod.nome);
    if (prod && prod.referencia) p.referencia = u.maiusc(prod.referencia);
    const extras = r.cotas.filter(c => c.origem === 'manual');
    const val = v => (v === null || v === undefined || v === '' || isNaN(v)) ? undefined : +v;
    r.cotas = (prod ? prod.cotas : []).map(c => novaCotaManual(c.cod, c.desc, 'desenho', val(c.nominal), val(c.sup), val(c.inf))).concat(extras);
    definirVisuaisDaNorma([]);
  }

  function novaCotaManual(cod, desc, origem, nominal, sup, inf) {
    return {
      id: u.uid(), cod: cod, desc: desc, nominal: nominal === undefined ? null : nominal, criterio: 'nominal',
      tolSup: sup === undefined ? null : sup, tolInf: inf === undefined ? null : inf,
      editavel: true, nota: '', origem: origem || 'manual', medidas: new Array(E.rel.pecas).fill(''), sitManual: null
    };
  }

      }

        Array.from({ length: r.pecas }, (_, i) => '<span>Peça ' + (i + 1) + '</span>').join('') + '<span>Situação</span></div>' +

  /** Valor para os campos de digitação (sem separador de milhar, para não virar "1.530" → 1,53). */
  function textoNum(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = u.num(v);
    return isNaN(n) ? String(v) : u.fmtEntrada(n);
  }

  function classeMed(st) { return st === 'ok' ? 'm-ok' : st === 'nc' ? 'm-nc' : ''; }

  function htmlCota(c, ordem) {
    const st = A.cota(c);
    const livre = c.origem !== 'norma';
    let h = '<div class="dim-linha s-' + st + '" data-linha="' + c.id + '">' +
      (c.corrigida ? '<div class="dim-cod corr" title="Valor corrigido pela Qualidade">' : '<div class="dim-cod">') + esc(c.cod) + '</div>' +
      '<div class="dim-desc">' + esc(c.desc) + (c.nota ? '<small>' + esc(c.nota) + '</small>' : '') + '</div>' +
      '<div class="dim-info">';
    if (c.editavel || livre) {
      h += '<div class="dim-nom"><span class="rot">Nominal</span><input class="inp-num peq" inputmode="decimal" autocomplete="off" data-nom="' + c.id + '" value="' + esc(textoNum(c.nominal)) + '" placeholder="—" aria-label="Nominal ' + esc(c.cod) + '"></div>';
    } else {
      h += '<div class="dim-nom"><span class="rot">Nominal</span><b>' + esc(u.fmt(c.nominal)) + '</b>' + (c.criterio === 'min' ? '<span class="lim">mín.</span>' : '') + '</div>';
    }
    if (livre) {
      h += '<div class="dim-tol"><span class="rot">Tol. + / −</span><span style="display:flex;gap:4px">' +
        '<input class="inp-num peq" style="width:52px" inputmode="decimal" data-tol="sup" data-id="' + c.id + '" value="' + esc(textoNum(c.tolSup)) + '" placeholder="+" aria-label="Tolerância superior">' +
        '<input class="inp-num peq" style="width:52px" inputmode="decimal" data-tol="inf" data-id="' + c.id + '" value="' + esc(textoNum(c.tolInf)) + '" placeholder="−" aria-label="Tolerância inferior"></span>' +
        '<span class="lim" data-lim="' + c.id + '">' + esc(A.textoLimites(c)) + '</span></div>';
    } else {
      h += '<div class="dim-tol"><span class="rot">Tolerância</span><span>' + esc(A.textoTol(c)) + '</span><span class="lim" data-lim="' + c.id + '">' + esc(A.textoLimites(c)) + '</span></div>';
    }
    h += '</div><div class="dim-meds">';
    for (let i = 0; i < E.rel.pecas; i++) {
      const t = c.medidas[i] || '';
      const ms = c.sitManual === 'na' ? '' : A.medida(c, t);
      h += '<label class="med"><span>P' + (i + 1) + '</span><input inputmode="decimal" enterkeyhint="next" autocomplete="off" ' +
        'data-med="' + c.id + '" data-i="' + i + '" data-ordem="' + ordem + '" class="' + classeMed(ms) + '" value="' + esc(t) + '"' +
        (c.sitManual === 'na' ? ' disabled' : '') + ' aria-label="' + esc(c.cod) + ' peça ' + (i + 1) + '"></label>';
    }
    h += '</div><div class="dim-sit" data-sit="' + c.id + '">' + htmlSit(c) + '</div></div>';
    return h;
  }

  function justBtn(c) {
    if (c.sitManual !== 'ok' || !A.desvio(c)) return '';
    const d = A.desvio(c);
    return '<button type="button" class="pill ' + (String(c.just || '').trim() ? 'pill-ok' : 'pill-av') + ' just-btn" data-acao="just" data-id="' + c.id + '" title="Medida até ' + esc(u.fmt(d.max)) + ' mm do nominal (aviso a partir de ' + esc(u.fmt(d.lim)) + ' mm)">' +
      (String(c.just || '').trim() ? ui.icon('check') + 'justificado' : ui.icon('alerta') + 'desvio ' + esc(u.fmt(d.max)) + ' · justificar') + '</button>';
  }

  function htmlSit(c) {
    const st = A.cota(c);
    const mais = '<button type="button" class="btn-icone" data-acao="mais" data-id="' + c.id + '" aria-label="Opções da cota ' + esc(c.cod) + '">' + ui.icon('mais') + '</button>';
    if (st === 'na') return '<span class="pill">N/A</span>' + mais;
    if (!A.limites(c)) {
      return '<div class="manual"><button type="button" data-acao="sit" data-v="ok" data-id="' + c.id + '" class="' + (c.sitManual === 'ok' ? 'on-ok' : '') + '" title="Aprovado" aria-label="Marcar aprovado">' + ui.icon('check') + '</button>' +
        '<button type="button" data-acao="sit" data-v="nc" data-id="' + c.id + '" class="' + (c.sitManual === 'nc' ? 'on-nc' : '') + '" title="Reprovado" aria-label="Marcar reprovado">' + ui.icon('x') + '</button></div>' + justBtn(c) + mais;
    }
    const mapa = {
      ok: '<span class="pill pill-ok" title="Aprovado">' + ui.icon('check') + 'AP</span>',
      nc: '<span class="pill pill-nc" title="Reprovado">' + ui.icon('x') + 'RP</span>',
      parcial: '<span class="pill pill-av" title="Faltam medições">Falta</span>',
      pendente: '<span class="pill" title="Sem medições">Pendente</span>'
    };
    return (mapa[st] || '') + mais;
  }

  function cota(id) { return E.rel.cotas.find(c => c.id === id); }

  /** Atualiza só a linha da cota (sem redesenhar a tabela, para não perder o foco). */
  function atualizarLinha(c) {
    const linha = E.main.querySelector('[data-linha="' + c.id + '"]');
    if (!linha) return;
    linha.className = 'dim-linha s-' + A.cota(c);
    linha.querySelectorAll('input[data-med]').forEach(inp => {
      const ms = c.sitManual === 'na' ? '' : A.medida(c, c.medidas[+inp.dataset.i]);
      inp.className = classeMed(ms);
    });
    const lim = linha.querySelector('[data-lim]');
    if (lim) lim.textContent = A.textoLimites(c);
    linha.querySelector('[data-sit]').innerHTML = htmlSit(c);
  }

  /** Usa o layout em tabela quando todas as colunas cabem na largura; senão, cartões empilhados. */
  function ajustarLayoutDim() {
    const lista = document.getElementById('dim-lista');
    if (!lista) return;
    lista.classList.add('em-linha');
    const linha = lista.querySelector('.dim-linha');
    if (linha && linha.scrollWidth > linha.clientWidth + 2) lista.classList.remove('em-linha');
  }

  async function mudarPecas(delta) {
    const r = E.rel;
    const novo = Math.max(1, Math.min(MAX_PECAS, r.pecas + delta));
    if (novo === r.pecas) return;
    if (novo < r.pecas && r.cotas.some(c => String(c.medidas[r.pecas - 1] || '').trim())) {
      const ok = await ui.confirmar('A peça ' + r.pecas + ' tem medições. Remover essa coluna?', { titulo: 'Remover peça', ok: 'Remover', perigo: true });
      if (!ok) return;
    }
    r.pecas = novo;
    normalizar(r);
    pintarDim(); atualizarResumo(); E.salvar();
  }

  async function opcoesCota(id) {
    const c = cota(id);
    if (!c) return;
    const botoes = [];
    botoes.push({ rotulo: c.sitManual === 'na' ? 'Voltar a avaliar' : 'Não aplicável (N/A)', classe: 'btn-sec', valor: 'na' });
    if (c.medidas.some(m => String(m).trim())) botoes.push({ rotulo: 'Limpar medições', classe: 'btn-sec', valor: 'limpar' });
    if (c.origem !== 'norma') botoes.push({ rotulo: 'Remover cota', classe: 'btn-perigo', valor: 'remover' });
    const v = await ui.modal({
      titulo: 'Cota ' + c.cod + ' — ' + c.desc,
      html: '<p class="modal-texto">' + (c.origem === 'norma'
        ? 'Cota da norma. Use N/A quando ela não se aplica a esta peça (ex.: face plana sem ressalto).' +
          (c.corrigida
            ? '<br><br><b>Valor corrigido pela Qualidade</b>' + (c.corrigida.responsavel ? ' (' + esc(c.corrigida.responsavel) + (c.corrigida.data ? ', ' + esc(c.corrigida.data) : '') + ')' : '') +
              '. Na norma: ' + esc(c.corrigida.norma.texto) + '.' + (c.corrigida.motivo ? ' Motivo: ' + esc(c.corrigida.motivo) + '.' : '')
            : '<br><br>Se o valor da norma estiver errado, a Qualidade corrige em Configurações › Validar combinação, e ele passa a valer nos relatórios.')
        : 'Cota adicionada neste relatório.') + '</p>',
      botoes: botoes
    });
    if (!v) return;
    if (v === 'na') c.sitManual = c.sitManual === 'na' ? null : 'na';
    if (v === 'limpar') { c.medidas = c.medidas.map(() => ''); if (c.sitManual !== 'na') c.sitManual = null; }
    if (v === 'remover') E.rel.cotas = E.rel.cotas.filter(x => x.id !== c.id);
    pintarDim(); atualizarResumo(); E.salvar();
  }

  async function justificar(id) {
    const c = cota(id);
    if (!c) return;
    const d = A.desvio(c);
    const v = await ui.modal({
      titulo: 'Cota ' + c.cod + ' — conforme com desvio',
      html: '<p class="modal-texto">Esta cota não tem tolerância na norma e uma medida ficou <b>' + esc(u.fmt(d ? d.max : 0)) + ' mm</b> longe do nominal (' + esc(u.fmt(c.nominal)) + ').' +
        ' Para manter <b>conforme</b>, explique o critério usado (sai no relatório).</p>' +
        '<div class="campo" style="margin-top:12px"><label for="just-t">Justificativa</label><textarea class="inp maiusc" id="just-t" rows="3" placeholder="Ex.: desenho do cliente pede 236 ± 1">' + esc(c.just || '') + '</textarea></div>',
      botoes: [
        { rotulo: 'Cancelar', classe: 'btn-sec', valor: null },
        { rotulo: 'Marcar não conforme', classe: 'btn-perigo', valor: 'nc' },
        { rotulo: 'Salvar justificativa', classe: 'btn-pri', acao: cx => { const t = u.maiusc(cx.querySelector('#just-t').value.trim()); if (!t) { ui.toast('Escreva a justificativa.', 'erro'); return false; } return { t: t }; } }
      ]
    });
    if (!v) return;
    if (v === 'nc') { c.sitManual = 'nc'; } else { c.just = v.t; }
    atualizarLinha(c); atualizarResumo(); E.salvar();
  }

  async function adicionarCota() {
    const v = await ui.modal({
      titulo: 'Cota adicional',
      html: '<div class="campos" style="grid-template-columns:1fr 2fr">' +
        '<div class="campo"><label>Código</label><input class="inp maiusc" id="nc-cod" maxlength="6" placeholder="Ex.: C1"></div>' +
        '<div class="campo"><label>Descrição</label><input class="inp maiusc" id="nc-desc" placeholder="Ex.: Ø do rebaixo"></div></div>' +
        '<div class="campos" style="grid-template-columns:repeat(3,1fr);margin-top:12px">' +
        '<div class="campo"><label>Nominal</label><input class="inp" id="nc-nom" inputmode="decimal"></div>' +
        '<div class="campo"><label>Tol. +</label><input class="inp" id="nc-sup" inputmode="decimal"></div>' +
        '<div class="campo"><label>Tol. −</label><input class="inp" id="nc-inf" inputmode="decimal"></div></div>' +
        '<p class="ajuda" style="margin-top:10px">Sem tolerância, o inspetor marca conforme / não conforme.</p>',
      botoes: [
        { rotulo: 'Cancelar', classe: 'btn-sec', valor: null },
        { rotulo: 'Adicionar', classe: 'btn-pri', acao: caixa => {
          const cod = u.maiusc(caixa.querySelector('#nc-cod').value.trim());
          const desc = u.maiusc(caixa.querySelector('#nc-desc').value.trim());
          if (!cod || !desc) { ui.toast('Preencha código e descrição.', 'erro'); return false; }
          const num = id => { const x = u.num(caixa.querySelector(id).value); return isNaN(x) ? null : x; };
          return { cod: cod, desc: desc, nom: num('#nc-nom'), sup: num('#nc-sup'), inf: num('#nc-inf') };
        } }
      ]
    });
    if (!v) return;
    E.rel.cotas.push(novaCotaManual(v.cod, v.desc, 'manual', v.nom, v.sup, v.inf));
    pintarDim(); atualizarResumo(); E.salvar();
  }

  /* =======================================================
     4. Inspeção visual
     ======================================================= */
  function pintarVisual() {
    const itens = E.rel.visual;
    let h;

  function situacaoCalibracao(validade, dataRef) {
    if (!validade) return { cls: '', txt: 'Sem validade' };
    if (validade < (dataRef || u.hojeISO())) return { cls: 'pill-nc', txt: 'Vencido ' + u.dataBR(validade) };
    const d = u.diasAte(validade);
    if (d <= 30) return { cls: 'pill-av', txt: 'Vence ' + u.dataBR(validade) };
    return { cls: 'pill-ok', txt: 'Até ' + u.dataBR(validade) };
  }

    const lista = cfg().instrumentos || [];
    const sel = E.rel.instrumentos.map(i => i.id);

    if (!lista.length) {

        '<a class="btn btn-sec" href="#/config">' + ui.icon('ajustes') + 'Abrir configurações</a></div>';

      h = '<div class="instr-lista">' + lista.map(i => {

          '<span class="caixa">' + ui.icon('check') + '</span><span class="instr-txt"><b>' + esc(i.codigo) + '</b><span>' + esc(i.descricao) + '</span></span>' +
          '<span class="pill ' + s.cls + '">' + esc(s.txt) + '</span></button>';

  function pintarSugestao(res) {
    const el = document.getElementById('sugestao');
    if (!el) return;
    const c = res.cotas, v = res.visual;
    let cls = '', icone = 'resultado', titulo, detalhe;
    if (res.sugestao === 'reprovado') {
      cls = 's-reprovado'; icone = 'alerta'; titulo = 'Sugestão do sistema: REPROVADO';
      detalhe = [c.nc ? c.nc + ' cota(s) reprovada(s)' : '', v.NC ? v.NC + ' item(ns) visual(is) reprovado(s)' : ''].filter(Boolean).join(' · ');
    } else if (res.sugestao === 'aprovado') {
      cls = 's-aprovado'; icone = 'check'; titulo = 'Sugestão do sistema: APROVADO';
      detalhe = 'Todas as cotas e itens visuais aprovados.';
    } else {
      titulo = 'Sugestão do sistema: aguardando';
      const falta = [];
