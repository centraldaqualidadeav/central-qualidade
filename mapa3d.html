<style>
/* Mapa de processos 3D: o galpão à noite (opção 3), com as etapas da Central como estações.

.top > * { pointer-events: auto; }
.brand { display: grid; gap: 6px; background: var(--glass); padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); backdrop-filter: blur(8px); }
.brand span { font: 500 10.5px/1 var(--fm); letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); }
.brand b { font: 800 26px/.95 var(--fd); letter-spacing: .01em; text-transform: uppercase; }
.brand i { display: block; height: 4px; width: 100%; max-width: 260px; border-radius: 3px; background: var(--rev); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tb { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--fb); background: var(--glass); border: 1px solid #343a3c; border-radius: 10px; padding: 0 13px; height: 40px; cursor: pointer; backdrop-filter: blur(8px); text-decoration: none; color: var(--ink); }
.tb:hover { border-color: #59636a; } .tb.on { background: var(--ink); color: #0F1112; border-color: var(--ink); }
.tb select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; font: 600 13px/1 var(--fb); color: inherit; padding: 0 16px 0 0; cursor: pointer; outline: none; }

.steps::-webkit-scrollbar { display: none; }

.steps button i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11.5px/1 var(--fb); color: #fff; background: var(--c); flex: none; }
.steps button:hover { background: rgba(255,255,255,.06); } .steps button.on { background: var(--ink); color: #0F1112; }
.steps button.dim { opacity: .35; }
.steps .sep { width: 1px; background: var(--line); margin: 4px 4px; flex: none; }
@media (max-width: 1500px) and (min-width: 761px) { .steps button.sup { padding: 7px; } .steps button.sup span { display: none; } }
.card { position: fixed; right: max(16px, env(safe-area-inset-right)); top: 76px; width: 380px; max-height: calc(100dvh - 160px); overflow: auto; background: rgba(15,17,18,.94); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 14px; padding: 14px 16px 16px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.45); z-index: 6; backdrop-filter: blur(8px); }

body.embed .brand { display: none; } body.embed .top { justify-content: flex-end; }

  .card h2 { font-size: 25px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { #load { transition: none; } }

  iqf: { quem: 'Qualidade · Compras', onde: 'Menu Avaliação de fornecedores', dev: 'Computador', it: 'IT-QUA-09', roles: ['qual', 'comp'],
    passos: ['Acompanhar as classes e quem mudou de classe.', 'Na ficha do fornecedor: Relatório de desempenho (classe C: plano de ação em 15 dias).', 'Registrar ação / situação: Aprovado, Em desenvolvimento ou Suspenso.', 'Todo mês: Fechar mês.'],
    auto: ['Recalcula a nota a cada lote e RNC.', 'Fornecedor Suspenso é avisado no recebimento, no RIR e na RNC.'] },
  serv: { quem: 'Qualidade', onde: 'Menu Serviços › Novo serviço', dev: 'Computador', it: 'IT-QUA-10', roles: ['qual'],
    passos: ['Menu Serviços › Novo serviço.', 'Data, tipo de serviço, fornecedor, NF, pedidos e nº do certificado (* = sem certificado).', 'Clicar em Gravar serviço.'],
    auto: ['Gera o número SV-NNNN.', 'Liga o serviço aos lotes e RNC com a mesma NF ou pedido.'] }
};
const ORDEM = ['rec', 'rir', 'rnc', 'cheg', 'rif', 'cert', 'ent', 'rnd', 'cal', 'sold', 'iqf', 'serv'];
const PAPEIS = [['todos', 'Todos'], ['conf', 'Conferente'], ['insr', 'Inspetor de recebimento'], ['insu', 'Inspetor de usinagem'], ['qual', 'Qualidade'], ['comp', 'Compras'], ['adm', 'Administrador']];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const lighten = (c) => '#' + new THREE.Color(c).lerp(new THREE.Color('#ffffff'), 0.35).getHexString();

/* ---------- controles da câmera ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 7; controls.maxDistance = 105; controls.maxPolarAngle = 1.38; controls.screenSpacePanning = false;
/* visão geral: de lado na tela deitada; em pé (celular), de frente para o Recebimento, com o processo indo para o fundo */
const FIT = [[-29.5, 0, 17.8], [27, 0, 17.8], [-30, 9.4, -20], [31, 9.4, -20]].map((a) => new THREE.Vector3(...a));
const tanH = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
function vgFor() {
  if (camera.aspect < 0.9) { const tgt = new THREE.Vector3(-6, 0, 0.8); return { pos: tgt.clone().addScaledVector(new THREE.Vector3(-0.68, 0.73, 0).normalize(), Math.max(60, 14.5 / tanH())), tgt }; }
  const tgt = new THREE.Vector3(-1.5, 0, 1.6), dir = new THREE.Vector3(10.5, 45, 55.4).normalize();
  /* afasta a câmera até o galpão inteiro caber entre o título (em cima) e a barra de etapas (embaixo) */
  const cam = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 400), top = 1 - 2 * 92 / H, bot = -1 + 2 * 66 / H;
  let d = 72.1;
  for (; d < 130; d += 1.5) { cam.position.copy(tgt).addScaledVector(dir, d); cam.lookAt(tgt); cam.updateMatrixWorld(); if (FIT.every((p) => { const v = p.clone().project(cam); return Math.abs(v.x) <= 0.985 && v.y <= top && v.y >= bot; })) break; }
  controls.maxDistance = Math.max(105, d + 12);
  return { pos: tgt.clone().addScaledVector(dir, d), tgt };
}
let VG = vgFor();
camera.position.copy(VG.pos); controls.target.copy(VG.tgt); controls.update();
const clampTarget = () => { const t = controls.target; t.x = THREE.MathUtils.clamp(t.x, -34, 34); t.z = THREE.MathUtils.clamp(t.z, -19, 20); t.y = THREE.MathUtils.clamp(t.y, 0, 6); };
let dirty = true; controls.addEventListener('change', () => { clampTarget(); dirty = true; });

/* ---------- pós-processamento ---------- */
let composer = null, ao = null;
function buildComposer() {
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 }));
  composer.addPass(new RenderPass(scene, camera));
  if (!LOW) { ao = new GTAOPass(scene, camera, W, H); ao.output = GTAOPass.OUTPUT.Default; ao.blendIntensity = 0.85; ao.updateGtaoMaterial({ radius: 1.0, distanceExponent: 1.5, thickness: 2, scale: 1, samples: 12 }); composer.addPass(ao); }
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.42, 0.5, 1.0));
  composer.addPass(new OutputPass());
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(W, H);
}
buildComposer();
addEventListener('resize', () => { W = innerWidth; H = innerHeight; const vira = (camera.aspect < 0.9) !== (W / H < 0.9); camera.aspect = W / H; camera.fov = fovFor(camera.aspect); camera.updateProjectionMatrix(); VG = vgFor(); if (vira && !atual && !anims.length) { camera.position.copy(VG.pos); controls.target.copy(VG.tgt); controls.update(); } renderer.setSize(W, H, false); composer.setSize(W, H); if (ao) ao.setSize(W, H); dirty = true; });

/* ---------- caminho do lote no chão ---------- */
const tOf = (curve, x) => { let best = 0, bd = 1e9; for (let i = 0; i <= 600; i++) { const t = i / 600, d = Math.abs(curve.getPointAt(t).x - x); if (d < bd) { bd = d; best = t; } } return best; };
const TT = Object.fromEntries(['rec', 'rir', 'cheg', 'rif', 'cert', 'ent'].map((k) => [k, tOf(MAIN, S[k].x)]));
let lot = { curve: MAIN, t: TT.rec };
place(lot.curve, lot.t);

/* ---------- animações (câmera e empilhadeira) ---------- */
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
let anims = [];
function animate(dur, fn) { return new Promise((res) => { anims.push({ t0: performance.now(), dur, fn, res }); dirty = true; }); }
function flyTo(pos, tgt, dur = 1300) { const p0 = camera.position.clone(), t0 = controls.target.clone(); return animate(dur, (u) => { const e = ease(u); camera.position.lerpVectors(p0, pos, e); controls.target.lerpVectors(t0, tgt, e); }); }
function camFor(k) { const s = S[k]; const tgt = new THREE.Vector3(s.x + 0.5, 2.4, s.z + (s.sup ? 0.5 : 0)); const fz = Math.max(1, 6.5 / tanH() / 20.9); const pos = tgt.clone().add(new THREE.Vector3(-7.5, 10.5, 16.5).multiplyScalar(fz)); return { pos, tgt }; }
function driveTo(curve, t1, dur) { const c = curve, a = lot.curve === c ? lot.t : 0; return animate(dur, (u) => { lot.curve = c; lot.t = THREE.MathUtils.lerp(a, t1, ease(u)); place(c, lot.t); }); }

/* ---------- interface ---------- */
const stepsEl = document.getElementById('steps'), card = document.getElementById('card'), sel = document.getElementById('papel');
sel.innerHTML = PAPEIS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
/* ordem: ?papel= no endereço › a escolha guardada neste aparelho › a sugestão da Central (?sug=) › Todos */
let papel = Q.get('papel') || ''; try { papel = papel || localStorage.getItem('cq-m3-papel') || ''; } catch (e) { /* sem armazenamento */ } papel = papel || Q.get('sug') || 'todos';
if (!PAPEIS.some(([k]) => k === papel)) papel = 'todos'; sel.value = papel;
const doPapel = (k) => papel === 'todos' || papel === 'adm' || INFO[k].roles.includes(papel);
let atual = null;
function drawSteps() {
  stepsEl.innerHTML = ORDEM.map((k, i) => (i === 8 ? '<span class="sep"></span>' : '') + `<button type="button" data-k="${k}" class="${k === atual ? 'on' : ''}${doPapel(k) ? '' : ' dim'}${S[k].sup ? ' sup' : ''}" style="--c:${S[k].c}" title="${esc(S[k].t)}"><i>${S[k].n}</i><span>${esc(S[k].t.replace('Inspeção de recebimento', 'Inspeção receb.').replace('Reclamação do cliente', 'Reclamação').replace('Avaliação de fornecedores', 'Fornecedores').replace('Chegada na usinagem', 'Chegada usinagem'))}</span></button>`).join('');
  /* rola só a barra (scrollIntoView rolaria também a página da Central por fora) */
  const b = stepsEl.querySelector('.on'); if (b) stepsEl.scrollTo({ left: b.offsetLeft - (stepsEl.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
}
function applyPapel() {
  ST.forEach((s) => { const on = doPapel(s.k), sg = SIGNS[s.k]; sg.mat.opacity = on ? 1 : 0.22; sg.back.opacity = on ? 1 : 0.3; s.line.opacity = on ? 0.95 : 0.2; s.fill.opacity = on ? 0.10 : 0.03; s.txt.opacity = on ? 0.92 : 0.2; });
  drawSteps(); dirty = true;
}
function showCard(k) {
  const s = S[k], d = INFO[k]; card.hidden = false; card.style.setProperty('--c', s.c); card.style.setProperty('--cl', lighten(s.c));
  const lista = papel === 'todos' || papel === 'adm' ? ORDEM : ORDEM.filter(doPapel), i = lista.indexOf(k);
  card.innerHTML = `<div class="k"><span>${s.sup ? 'Apoio' : 'Estação'} ${s.n} · ${esc(d.it)}</span><button class="x" type="button" data-x aria-label="Fechar">×</button></div>
    <h2>${esc(s.t)}</h2><span class="mod">${esc(s.mod.split(' · ')[0])}</span>
    <div class="facts"><span>Quem: <b>${esc(d.quem)}</b></span><span>Onde: <b>${esc(d.onde)}</b></span><span>Aparelho: <b>${esc(d.dev)}</b></span></div>
    ${d.nota ? `<div class="nota">${esc(d.nota)}</div>` : ''}
    <h3>Passo a passo</h3><ol>${d.passos.map((p) => `<li><span>${esc(p)}</span></li>`).join('')}</ol>
    ${d.trava ? `<h3>Não deixa concluir se</h3><ul class="stop">${d.trava.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    <h3>A Central faz sozinha</h3><ul class="auto">${d.auto.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
    <div class="nav2"><button type="button" data-nav="-1" ${i <= 0 ? 'disabled' : ''}>◀ Anterior</button><button type="button" class="p" data-nav="1" ${i < 0 || i >= lista.length - 1 ? 'disabled' : ''}>Próxima ▶</button></div>`;
  card.scrollTop = 0;
}
async function irPara(k, opts = {}) {
  if (!S[k]) return; atual = k; drawSteps(); showCard(k); hideHint();
  document.getElementById('b-geral').classList.remove('on');
  const main = TT[k] != null;
  if (opts.lote !== false && main && lot.curve === MAIN) await Promise.all([driveTo(MAIN, TT[k], 1600), (async () => { const c = camFor(k); await flyTo(c.pos, c.tgt, 1500); })()]);
  else if (opts.lote !== false && k === 'rnc') { if (lot.curve !== MAIN) { await driveTo(RP, 0, 600); lot = { curve: MAIN, t: TT.rir }; } await driveTo(MAIN, TT.rir, 900); lot = { curve: RP, t: 0 }; const c = camFor(k); await Promise.all([driveTo(RP, 0.62, 1400), flyTo(c.pos, c.tgt, 1500)]); }
  else if (opts.lote !== false && main && lot.curve === RP) { await driveTo(RP, 0, 700); lot = { curve: MAIN, t: TT.rir }; const c = camFor(k); await Promise.all([driveTo(MAIN, TT[k], 1400), flyTo(c.pos, c.tgt, 1500)]); }
  else { const c = camFor(k); await flyTo(c.pos, c.tgt, 1400); }
}
function visaoGeral() { atual = null; card.hidden = true; drawSteps(); document.getElementById('b-geral').classList.add('on'); return flyTo(VG.pos.clone(), VG.tgt.clone(), 1400); }
function vizinho(dir) { const lista = papel === 'todos' || papel === 'adm' ? ORDEM : ORDEM.filter(doPapel); const i = lista.indexOf(atual); const k = lista[Math.max(0, Math.min(lista.length - 1, (i < 0 ? -1 : i) + dir))]; if (k) irPara(k); }

/* passeio */
let tour = false;
async function passeio() {
  const b = document.getElementById('b-tour');
  if (tour) { tour = false; b.classList.remove('on'); b.innerHTML = '▶ <span class="lbl">Andar sozinho</span>'; return; }
  tour = true; b.classList.add('on'); b.innerHTML = '■ <span class="lbl">Parar</span>';
  const lista = ORDEM.filter((k) => doPapel(k) && !(papel === 'todos' && S[k].sup));
  if (lot.curve !== MAIN || lot.t > TT.rec + 0.001) { lot = { curve: MAIN, t: TT.rec }; place(MAIN, TT.rec); }
  for (const k of lista) { if (!tour) break; await irPara(k); for (let w = 0; w < 60 && tour; w++) await new Promise((r) => setTimeout(r, 100)); }
  if (tour) { tour = false; b.classList.remove('on'); b.innerHTML = '▶ <span class="lbl">Andar sozinho</span>'; }
}

/* toques e cliques */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
function pickAt(ev) { const r = renderer.domElement.getBoundingClientRect(); ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ptr, camera); const h = ray.intersectObjects(PICK, false).find((i) => !i.object.material.visible || i.object.material.opacity > 0.5); return h ? h.object.userData.k : null; }
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; hideHint(); });
renderer.domElement.addEventListener('pointerup', (e) => { if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null; if (moved > 7) return; const k = pickAt(e); if (k) { tour = false; irPara(k); } });
let hov = null;
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse' || down) return; const k = pickAt(e); if (k !== hov) { if (hov) S[hov].fill.opacity = doPapel(hov) ? 0.10 : 0.03; hov = k; if (k) S[k].fill.opacity = 0.24; renderer.domElement.style.cursor = k ? 'pointer' : ''; dirty = true; } });
stepsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { tour = false; irPara(b.dataset.k); } });
card.addEventListener('click', (e) => { if (e.target.closest('[data-x]')) { card.hidden = true; return; } const n = e.target.closest('[data-nav]'); if (n && !n.disabled) { tour = false; vizinho(+n.dataset.nav); } });
document.getElementById('b-geral').onclick = () => { tour = false; visaoGeral(); };
document.getElementById('b-tour').onclick = () => passeio();
sel.onchange = () => { papel = sel.value; try { localStorage.setItem('cq-m3-papel', papel); } catch (e) { /* sem armazenamento */ } applyPapel(); if (atual) showCard(atual); };
addEventListener('keydown', (e) => { if (e.target.closest && e.target.closest('select')) return; if (e.key === 'ArrowRight') vizinho(1); else if (e.key === 'ArrowLeft') vizinho(-1); else if (e.key === 'Escape') { card.hidden = true; } });
let hintOff = false; function hideHint() { if (hintOff) return; hintOff = true; document.getElementById('hint').hidden = true; }

/* ---------- laço de desenho: só desenha quando algo mudou ---------- */
const flame = scene.getObjectByProperty('type', 'PointLight');
let idleAO = 0, busyOff = false; const viewOff = { x: 0, y: 0 };
new MutationObserver(() => { dirty = true; }).observe(card, { attributes: true, attributeFilter: ['hidden'] });
function loop(now) {
  requestAnimationFrame(loop);
  let busy = false;
  if (anims.length) { busy = true; anims = anims.filter((a) => { const u = Math.min(1, (now - a.t0) / a.dur); a.fn(u); if (u >= 1) { a.res(); return false; } return true; }); }
  if (controls.update()) busy = true;
  if (busyOff) busy = true;
  if (busy) dirty = true;
  if (!dirty) { if (ao && !ao.enabled && now - idleAO > 250) { ao.enabled = true; dirty = true; } else return; }
  if (ao) { if (busy) { ao.enabled = false; idleAO = now; } }
  /* placas viram para a câmera e somem quando estão perto demais (não tapam a vista) */
  for (const k in SIGNS) { const sg = SIGNS[k], g = sg.grp; g.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    const f = k === atual ? 1 : THREE.MathUtils.clamp((camera.position.distanceTo(g.position) - 10) / 8, 0.06, 1), on = doPapel(k);
    sg.mat.opacity = (on ? 1 : 0.22) * f; sg.back.opacity = (on ? 1 : 0.3) * f; sg.mat.depthWrite = sg.back.depthWrite = f > 0.9; }
  for (const lg of LAMPS) lg.visible = camera.position.distanceTo(lg.userData.p) > 11;
  /* com o cartão aberto no computador, a cena anda um pouco para a esquerda */
  /* (no celular o cartão fica embaixo: a cena sobe para a parte livre da tela) */
  const aberto = !card.hidden, ox = aberto && W > 760 ? Math.min(card.offsetWidth + 24, W * 0.4) / 2 : 0, oy = aberto && W <= 760 ? Math.min(H * 0.3, (H - card.getBoundingClientRect().top) / 2) : 0;
  if (Math.abs(ox - viewOff.x) + Math.abs(oy - viewOff.y) > 0.8) { viewOff.x += (ox - viewOff.x) * 0.18; viewOff.y += (oy - viewOff.y) * 0.18; busyOff = true; } else { viewOff.x = ox; viewOff.y = oy; busyOff = false; }
  if (viewOff.x > 0.5 || viewOff.y > 0.5) camera.setViewOffset(W, H, viewOff.x, viewOff.y, W, H); else camera.clearViewOffset();
  composer.render(); dirty = false;
}
applyPapel();
composer.render();
requestAnimationFrame(loop);
const L = document.getElementById('load'); L.classList.add('out'); setTimeout(() => L.remove(), 600);
if (Q.get('e')) irPara(Q.get('e'));
window.__m3 = { irPara, visaoGeral, passeio, S, camera, controls, ready: true };
</script>
</body>
</html>
