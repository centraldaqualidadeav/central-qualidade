<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lote · Qualidade Aços Vital</title>
<meta name="theme-color" content="#0F1112">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #eef0ed; --surface: #fff; --line: #d3d8d2; --line2: #edf0ec; --ink: #1b211e; --ink2: #48514c; --ink3: #737d77; --av: #378267; --ok: #1d7446; --crit: #b3261e; --warn: #9a6400; --geral: #6c7772;
  --fb: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --fd: "Barlow Condensed", "Arial Narrow", sans-serif; --fm: "IBM Plex Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--fb); }
.pg { max-width: 560px; margin: 0 auto; padding: 16px 16px 26px; display: grid; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.cq { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cq svg { width: 40px; height: 40px; flex: none; }
.cq .t { display: grid; gap: 4px; min-width: 0; }
.cq b { font: 800 clamp(15px, 4.6vw, 18px)/1 var(--fd); text-transform: uppercase; letter-spacing: .01em; }
.st { display: block; width: 120px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #EBDCA6 0%, #D7AA55 17%, #AA6A31 34%, #7B417A 50%, #33428F 66%, #4F87C7 83%, #9CA7AF 100%); }
.top img { max-height: 46px; max-width: min(120px, 28vw); object-fit: contain; flex: none; }
.hero { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--geral); border-radius: 10px; padding: 18px 16px 16px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.hero.ok { border-top-color: var(--av); } .hero.crit { border-top-color: var(--crit); } .hero.warn { border-top-color: var(--warn); }
.seal { width: 84px; height: 84px; }
.eb { font: 600 11px/1.2 var(--fb); letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); margin-top: 2px; }
.code { font: 800 40px/1 var(--fd); letter-spacing: .01em; word-break: break-all; }
.desc { font-weight: 600; color: var(--ink2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; border-radius: 20px; padding: 4px 12px; margin-top: 4px; }
.chip.ok { background: #e3f1e8; color: var(--ok); } .chip.crit { background: #f9e3e1; color: var(--crit); } .chip.warn { background: #f8eedb; color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card h3 { margin: 0; padding: 9px 14px; font: 700 15px/1 var(--fd); text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--av); }
.card.g h3 { background: var(--geral); }
.card.nc h3 { background: var(--crit); }
.card.cc h3 { background: #b8860b; }
.card.i h3 { background: #2d77c1; }
.hero.i { border-top-color: #2d77c1; }
.hero.cc { border-top-color: #b8860b; }
.hero.sr { border-top-color: var(--crit); }
.r { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line2); }
.r:first-of-type { border-top: 0; }
.r span { color: var(--ink3); } .r b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.mono { font-family: var(--fm); font-size: 14px; }
.ft { font-size: 12px; color: var(--ink3); text-align: center; line-height: 1.5; }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 16px; text-align: center; color: var(--ink2); }
.spin { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 10px; background: conic-gradient(#EBDCA6, #D7AA55, #AA6A31, #7B417A, #33428F, #4F87C7, #9CA7AF); -webkit-mask: radial-gradient(circle, transparent 54%, #000 56%); mask: radial-gradient(circle, transparent 54%, #000 56%); animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 380px) { .st { width: 96px; } .code { font-size: 34px; } }
</style>
</head>
<body>
<div class="pg" id="pg">
  <div class="top">
    <div class="cq"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="cqrev" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#EBDCA6"/><stop offset="17%" stop-color="#D7AA55"/><stop offset="34%" stop-color="#AA6A31"/><stop offset="50%" stop-color="#7B417A"/><stop offset="66%" stop-color="#33428F"/><stop offset="83%" stop-color="#4F87C7"/><stop offset="100%" stop-color="#9CA7AF"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#0F1112"/><g transform="translate(0.0 0.0) scale(1.0)"><text x="256" y="318" text-anchor="middle" style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:236px;letter-spacing:4px" fill="#F1F0EB">CQ</text><rect x="112" y="358" width="288" height="30" rx="15" fill="url(#cqrev)"/></g></svg>
      <div class="t"><b>Central da Qualidade</b><span class="st"></span></div></div>
    <img id="logo" alt="Aços Vital" hidden>
  </div>
  <div id="out"><div class="msg"><div class="spin"></div>Carregando os dados…</div></div>
</div>
<script>
(function () {
  var PID = 'centraldaqualidade-av', KEY = 'AIzaSyDqEDlxnXfFvhcBcX3A_upZ56sGkZ9ckwU';
  var BASE = 'https://firestore.googleapis.com/v1/projects/' + PID + '/databases/(default)/documents/';
  var SEAL = '<svg class="seal" aria-hidden="true" viewBox="0 0 100 100"><g fill="none" stroke-width="10"><path d="M58.5 13.0A38 38 0 0 1 65.0 15.1" stroke="#e9d89f" stroke-linecap="round"/><path d="M64.4 14.8A38 38 0 0 1 70.4 17.9" stroke="#e6d092"/><path d="M69.9 17.6A38 38 0 0 1 75.3 21.6" stroke="#e3c885"/><path d="M74.8 21.2A38 38 0 0 1 79.5 26.1" stroke="#e0bf78"/><path d="M79.2 25.6A38 38 0 0 1 83.0 31.2" stroke="#dcb76a"/><path d="M82.7 30.7A38 38 0 0 1 85.6 36.7" stroke="#d9af5d"/><path d="M85.4 36.2A38 38 0 0 1 87.3 42.6" stroke="#d4a653"/><path d="M87.2 42.1A38 38 0 0 1 88.0 48.8" stroke="#cd9c4d"/><path d="M88.0 48.2A38 38 0 0 1 87.7 54.9" stroke="#c69147"/><path d="M87.8 54.3A38 38 0 0 1 86.4 60.9" stroke="#be8741"/><path d="M86.6 60.3A38 38 0 0 1 84.2 66.6" stroke="#b77c3b"/><path d="M84.4 66.1A38 38 0 0 1 81.0 71.9" stroke="#af7235"/><path d="M81.4 71.4A38 38 0 0 1 77.1 76.6" stroke="#a86834"/><path d="M77.5 76.2A38 38 0 0 1 72.4 80.7" stroke="#a06141"/><path d="M72.9 80.3A38 38 0 0 1 67.2 83.9" stroke="#985a4e"/><path d="M67.7 83.6A38 38 0 0 1 61.5 86.2" stroke="#8f535a"/><path d="M62.1 86.0A38 38 0 0 1 55.5 87.6" stroke="#874c67"/><path d="M56.1 87.5A38 38 0 0 1 49.4 88.0" stroke="#7f4574"/><path d="M50.0 88.0A38 38 0 0 1 43.3 87.4" stroke="#75417c"/><path d="M43.9 87.5A38 38 0 0 1 37.3 85.8" stroke="#68417f"/><path d="M37.9 86.0A38 38 0 0 1 31.7 83.3" stroke="#5c4183"/><path d="M32.3 83.6A38 38 0 0 1 26.6 79.9" stroke="#4f4287"/><path d="M27.1 80.3A38 38 0 0 1 22.1 75.8" stroke="#43428a"/><path d="M22.5 76.2A38 38 0 0 1 18.3 70.9" stroke="#36428e"/><path d="M18.6 71.4A38 38 0 0 1 15.3 65.6" stroke="#364a96"/><path d="M15.6 66.1A38 38 0 0 1 13.3 59.8" stroke="#3b569f"/><path d="M13.4 60.3A38 38 0 0 1 12.2 53.7" stroke="#4061a8"/><path d="M12.2 54.3A38 38 0 0 1 12.1 47.6" stroke="#446cb1"/><path d="M12.0 48.2A38 38 0 0 1 13.0 41.5" stroke="#4977ba"/><path d="M12.8 42.1A38 38 0 0 1 14.8 35.6" stroke="#4d83c4"/><path d="M14.6 36.2A38 38 0 0 1 17.6 30.1" stroke="#578ac5"/><path d="M17.3 30.7A38 38 0 0 1 21.2 25.2" stroke="#638fc1"/><path d="M20.8 25.6A38 38 0 0 1 25.6 20.9" stroke="#7095bd"/><path d="M25.2 21.2A38 38 0 0 1 30.6 17.3" stroke="#7d9ab9"/><path d="M30.1 17.6A38 38 0 0 1 36.1 14.6" stroke="#899fb5"/><path d="M35.6 14.8A38 38 0 0 1 41.5 13.0" stroke="#96a4b1" stroke-linecap="round"/></g><path d="M35 51 L46 62 L67 39" fill="none" stroke="#1b211e" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var out = document.getElementById('out');
  function val(f) { if (!f) return ''; if ('stringValue' in f) return f.stringValue; if ('integerValue' in f) return Number(f.integerValue); if ('doubleValue' in f) return f.doubleValue; return ''; }
  function get(path) { return fetch(BASE + path + '?key=' + encodeURIComponent(KEY)).then(function (r) { if (r.status === 404 || r.status === 403) return null; if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function msg(t) { out.innerHTML = '<div class="msg">' + t + '</div>'; }
  /* logo da empresa (o mesmo de Configurações) */
  get('cfg/logo').then(function (d) { var img = d && d.fields ? val(d.fields.img) : ''; if (img) { var el = document.getElementById('logo'); el.src = img; el.hidden = false; } }).catch(function () {});
  var c = (new URLSearchParams(location.search).get('c') || '').replace(/[^a-z0-9]/gi, '');
  if (!c) { msg('Código do lote ausente. Leia novamente o QR code da etiqueta.'); return; }
  get('pub/' + c).then(function (d) {
    if (!d || !d.fields) { msg('<b>' + (c.length === 17 && c.charAt(0) === 'k' ? 'Instrumento' : 'Lote') + ' não encontrado.</b><br>Confira se o QR code está legível ou fale com a Qualidade da Aços Vital.'); return; }
    var x = {}; Object.keys(d.fields).forEach(function (k) { x[k] = val(d.fields[k]); });
    if (x.k === 'ins') { insPage(x); return; }
    var ins = String(x.insp || '').trim().toLowerCase();
    var st = ins === 'aprovado' ? ['ok', '✓ Aprovado na inspeção'] : ins === 'reprovado' ? ['crit', '✕ Reprovado na inspeção'] : (ins === 'em análise' || ins === 'em analise') ? ['warn', '! Em análise na inspeção'] : ins === 'liberado sob concessão' ? ['warn', '! Liberado sob concessão'] : null;
    /* lote reprovado, liberado sob concessão ou ligado a uma RNC: blocos em vermelho */
    var cc = ins === 'liberado sob concessão'; /* concessão: blocos em amarelo */
    var nc = !cc && (x.rnc === '1' || ins === 'reprovado');
    if (x.bloq) { st = ['crit', '⛔ ' + x.bloq]; nc = true; cc = false; } /* contenção pedida por reclamação de cliente */
    var row = function (l, v, mono) { return v === '' || v == null ? '' : '<div class="r"><span>' + l + '</span><b' + (mono ? ' class="mono"' : '') + '>' + esc(v) + '</b></div>'; };
    var card = function (t, rows, g) { return rows ? '<div class="card' + (g ? ' g' : cc ? ' cc' : nc ? ' nc' : '') + '"><h3>' + t + '</h3>' + rows + '</div>' : ''; };
    var dim = [x.diam, x.esp].filter(Boolean).join(' × ');
    var at = x.at ? new Date(Number(x.at)) : null;
    out.innerHTML = '<div style="display:grid;gap:14px">'
      + '<div class="hero ' + (cc ? 'cc' : nc ? 'crit' : st ? st[0] : '') + '">' + (st && st[0] === 'ok' ? SEAL : '') + '<span class="eb">Lote rastreado pela Qualidade</span><span class="code">' + esc(x.id) + '</span>'
      + '<span class="desc">' + esc([x.desc, dim].filter(Boolean).join(' · ')) + '</span>' + (st ? '<span class="chip ' + st[0] + '">' + st[1] + '</span>' : '') + '</div>'
      + card('Material', row('Descrição', x.desc) + row('Material', x.material) + row('Diâmetro', x.diam) + row('Espessura', x.esp) + row('Liga / tipo', x.liga) + row('Corrida', x.corrida, 1) + row('Volume', x.volume, 1) + row('Quantidade', x.quant || '—'))
      + card('Inspeção', row('Resultado da inspeção', x.insp) + row('Destino do material', x.dest) + row('Inspetor', x.conf || '—') + row('Recebido em', x.recebido) + row('Filial', x.filial))
      + card('Origem', row('Fornecedor', x.forn) + row('Nota fiscal', x.nf, 1) + row('Pedido de compra', x.pc, 1) + row('Pedido de venda', x.pv, 1), 1)
      + '<div class="ft">Página somente para consulta. Os dados são os registrados pela Qualidade da Aços Vital.' + (at ? '<br>Atualizado em ' + at.toLocaleDateString('pt-BR') + ' às ' + at.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '') + '</div></div>';
    document.title = (x.id || 'Lote') + ' · Qualidade Aços Vital';
  }).catch(function () { msg('Não foi possível carregar os dados agora. Verifique a internet e tente de novo.'); });
  /* instrumento de medição (etiqueta de calibração): a situação é calculada na hora, pela data de validade */
  function insPage(x) {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    var pd = function (s) { if (!s) return null; var p = String(s).split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; };
    var fd = function (s) { var dd = pd(s); return dd ? dd.toLocaleDateString('pt-BR') : ''; };
    var vd = pd(x.validade), dias = vd ? Math.round((vd - hoje) / 864e5) : null;
    var sit = String(x.situacao || '').trim().toLowerCase(), res = String(x.resultado || '').toUpperCase(), st;
    if (sit === 'descartado' || sit === 'fora de uso') st = ['crit', '✕ Fora de uso — não usar'];
    else if (sit === 'enviado para calibração') st = ['warn', '◆ No laboratório (em calibração)'];
    else if (sit === 'manutenção') st = ['warn', '◆ Em manutenção — não usar'];
    else if (sit === 'bloqueado' || res === 'REPROVADO') st = ['crit', '■ Bloqueado — não usar'];
    else if (dias == null) st = ['warn', '! Sem data de calibração'];
    else if (dias < 0) st = ['crit', '✕ Calibração vencida — não usar'];
    else if (dias <= (Number(x.aviso) || 30)) st = ['warn', '✓ Calibrado · vence ' + (dias === 0 ? 'hoje' : 'em ' + dias + ' dia(s)')];
    else st = ['ok', '✓ Calibrado — pode usar'];
    var resT = { APROVADO: 'Aprovado', REPROVADO: 'Reprovado', 'AGUARDANDO ANÁLISE': 'Aguardando análise do certificado', 'SEM CRITÉRIO': 'Aguardando análise do certificado' }[res] || '';
    var row = function (l, v, mono) { return v === '' || v == null ? '' : '<div class="r"><span>' + l + '</span><b' + (mono ? ' class="mono"' : '') + '>' + esc(v) + '</b></div>'; };
    var card = function (t, rows, g) { return rows ? '<div class="card ' + (g ? 'g' : 'i') + '"><h3>' + t + '</h3>' + rows + '</div>' : ''; };
    var at = x.at ? new Date(Number(x.at)) : null;
    out.innerHTML = '<div style="display:grid;gap:14px">'
      + '<div class="hero ' + (st[0] === 'ok' ? 'i' : st[0]) + '">' + (st[0] === 'ok' ? SEAL : '') + '<span class="eb">Instrumento de medição</span><span class="code">' + esc(x.codigo) + '</span>'
      + '<span class="desc">' + esc(x.desc || '') + '</span><span class="chip ' + st[0] + '">' + st[1] + '</span></div>'
      + card('Calibração', row('Calibrado em', fd(x.dataCal)) + row('Válido até', fd(x.validade)) + row('Resultado', resT) + row('Laboratório', x.lab) + row('Nº do certificado', x.cert, 1))
      + card('Instrumento', row('Tipo', x.tipo) + row('Marca', x.marca) + row('Nº de série', x.serie, 1) + row('Faixa de medição', x.faixa) + row('Resolução', x.resol))
      + card('Onde fica', row('Setor', x.setor) + row('Local / com quem está', x.local), 1)
      + '<div class="ft">Página somente para consulta. Os dados são os registrados pela Qualidade da Aços Vital.' + (at ? '<br>Atualizado em ' + at.toLocaleDateString('pt-BR') + ' às ' + at.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '') + '</div></div>';
    document.title = (x.codigo || 'Instrumento') + ' · Qualidade Aços Vital';
  }
})();
</script>
</body>
</html>
